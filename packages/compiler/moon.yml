# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
language: typescript
layer: library

dependsOn:
  - 'context'
  - 'router'
  - 'runtime'
# NOTE: The Rust binary is NOT built automatically by any Moon task.
# Run `cargo build --release` manually in packages/compiler/ before running
# integration tests or using the Vite plugin.
# See architecture.md §17, decision T2.

tasks:
  build:
    # `bunx` resolves the local node_modules/.bin binary; a BARE `rolldown`
    # relies on node_modules/.bin being on PATH, which `bun run` adds but moon's
    # task runner does not — so a cold-cache `moon run compiler:build` failed
    # with `rolldown: command not found` (exit 127). Mirrors `bunx tsc` below.
    command: "bunx rolldown -c"
    inputs:
      - "js/**/*.ts"
      - "rolldown.config.ts"
    outputs:
      - "dist"
    options:
      mergeArgs: "replace"

  typecheck:
    command: "bunx tsc --noEmit"
    inputs:
      - "js/**/*.ts"
      - "tsconfig.json"
    options:
      mergeArgs: "replace"
