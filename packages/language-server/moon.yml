# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
language: typescript
layer: library

# @aihu/tsc's types resolve to its built dist/index.d.ts, so its build must
# run before this project's typecheck. Moon does not derive project deps from
# package.json here (see `moon project language-server` → "Depends on: —"), so
# declare it explicitly; the global `typecheck` task's `^:build` then builds it.
dependsOn:
  - 'tsc'
