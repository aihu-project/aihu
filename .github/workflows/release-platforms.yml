name: Build and publish platform native packages

# Reusable workflow (workflow_call). Split out of release.yml so that its
# `release` job can depend on this and still run its
# no-`name:`-filter `download-artifact` step safely: a `workflow_call` job
# executes inside the SAME run as its caller, so artifacts uploaded here
# remain visible there. A separate top-level workflow would NOT have this
# property — it starts a new run, and download-artifact is run-scoped — see
# docs/plans/2026-08-10-platforms-before-pins.md §2.2 for the asset-loss
# mechanism that rules that shape out.
#
# Builds the two root-owned native addon families (@aihu/server and
# @aihu/css-engine) and publishes their @aihu/*-<platform> optionalDependency
# package sets to npm. The build-* jobs always run, so the GitHub Release always
# has fresh binaries; the publish-* jobs only run on a real tag push. Canary
# dispatches keep the last stable native pins while the root JavaScript packages
# are published, because these native families have independent version streams.
#
# Called from:
#   - release.yml, unconditionally, on every trigger (tag push, dry-run
#     dispatch, canary dispatch) — identical behavior to before the split.
#   - release-pr.yml, per docs/plans/2026-08-10-platforms-before-pins.md step
#     3 (not yet implemented as of this file's introduction): publish
#     platform packages at the new version BEFORE the pins that name them
#     land on main, gated on the stamp having actually moved a platform
#     version.
#
# `github.event_name`/`inputs.canary`/`inputs.dry_run` are NOT read directly
# in this file even though they were in the pre-split release.yml — a called
# workflow's ambient `github` context is the caller's, which is exactly the
# ambiguity an explicit contract avoids. Every job below branches on the
# `inputs.*` this workflow declares, computed once by the caller.
"on":
  workflow_call:
    inputs:
      is_release:
        description: 'Gates every publish-* job — true on a real v* tag push OR a canary workflow_dispatch'
        required: true
        type: boolean
      canary:
        description: 'Passthrough of the top-level workflow_dispatch `canary` input (false on any other trigger)'
        required: true
        type: boolean
      dry_run:
        description: 'Passthrough of the top-level workflow_dispatch `dry_run` input (false on any other trigger)'
        required: true
        type: boolean
# Mirrors release.yml's own env block — see there for the full rationale.
# Workflow-level `env:` does not cross a workflow_call boundary, so every
# `cargo build`/`cross build` step in this file needs its own copy.
env:
  RUSTUP_TOOLCHAIN: "1.95.0"

jobs:
  build-native:
    name: Build native ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    # Longest observed run of this job is ~3 min; without a bound a hang
    # inherits GitHub's 360 min default and stalls the release for six hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            platform: darwin-arm64
            node-file: server-native.darwin-arm64.node
            cdylib: libaihu_server_native.dylib
          # x86_64 darwin native addon: cross-target on macos-14 (see build matrix
          # above — macos-13 EOL'd 2025-12-04). napi-rs cross-targets cleanly when
          # rustup has the x86_64-apple-darwin stdlib installed.
          - runner: macos-14
            target: x86_64-apple-darwin
            platform: darwin-x64
            node-file: server-native.darwin-x64.node
            cdylib: libaihu_server_native.dylib
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64-gnu
            node-file: server-native.linux-x64-gnu.node
            cdylib: libaihu_server_native.so
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            platform: win32-x64-msvc
            node-file: server-native.win32-x64-msvc.node
            cdylib: aihu_server_native.dll
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable @ 2024-10-25
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Build release cdylib
        run: cargo build --release --target ${{ matrix.target }} --manifest-path packages/server/src-native/Cargo.toml

      - name: Stage .node file (Unix)
        if: runner.os != 'Windows'
        run: |
          cp packages/server/src-native/target/${{ matrix.target }}/release/${{ matrix.cdylib }} ${{ matrix.node-file }}

      - name: Stage .node file (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item -Path "packages/server/src-native/target/${{ matrix.target }}/release/${{ matrix.cdylib }}" -Destination "${{ matrix.node-file }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.platform }}
          path: ${{ matrix.node-file }}
          if-no-files-found: error
          retention-days: 7

  publish-native:
    name: Publish @aihu/server-* platform packages
    needs: build-native
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    # Longest observed run of this job is ~3 min; without a bound a hang
    # inherits GitHub's 360 min default and stalls the release for six hours.
    timeout-minutes: 20
    # Native platform packages publish on stable tags only. Canary root
    # packages keep their last stable native pins; these families are versioned
    # independently from the root snapshot.
    if: inputs.is_release && !inputs.canary
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Download all native artifacts
        uses: actions/download-artifact@v8
        with:
          path: native-artifacts

      - name: Stage and publish each platform package (idempotent)
        run: |
          set -euo pipefail
          for dir in packages/server/npm/*/; do
            platform=$(basename "$dir")
            node_file=$(ls native-artifacts/native-$platform/*.node 2>/dev/null || true)
            # HARD FAIL, not silent skip: a missing binary here would publish
            # an empty platform package and brick install resolution for that
            # platform (see publish-native's comment on why this
            # loop's OWN prior silent-skip shape was the anti-pattern).
            if [ -z "$node_file" ]; then
              echo "::error::no .node artifact for $platform (expected native-artifacts/native-$platform/*.node)"
              exit 1
            fi
            dest="$dir/$(basename "$node_file")"
            cp "$node_file" "$dest"
            # NOTE: unlike publish-css-native, we intentionally do NOT chmod 0755
            # here. .node files are dlopen()'d by Node/Bun, not exec()'d — the
            # OS loader does not require the exec bit. actions/download-artifact@v8
            # drops POSIX mode bits, but the resulting -rw-r--r-- is harmless for
            # napi addons. Do not change this without re-verifying dlopen on all
            # 4 platforms.
            # Final guard: the staged file must be non-empty before publish.
            if [ ! -s "$dest" ]; then
              echo "::error::staged binary is empty: $dest (platform $platform)"
              exit 1
            fi
            pkg_name=$(node -p "require('./$dir/package.json').name")
            pkg_version=$(node -p "require('./$dir/package.json').version")
            # Idempotency: 'npm view <pkg>@<ver>' returns the version string when
            # already published, empty string otherwise. Skip publish on hit so
            # release workflow re-runs (post-fix retag) don't 403 on the fixed
            # platform-publish step and skip-block downstream workspace publish.
            existing=$(npm view "${pkg_name}@${pkg_version}" version 2>/dev/null || true)
            if [ -n "$existing" ]; then
              echo "${pkg_name}@${pkg_version} already published — skipping"
              continue
            fi
            ( cd "$dir" && npm publish --access public )
          done

  # ---------------------------------------------------------------------------
  # @aihu/css-engine native CLI binary (aihu-css-compile, from the aihu-css-core
  # crate). Unlike @aihu/server's napi `.node` addon, css-engine invokes the
  # binary as a CLI SUBPROCESS — so the per-platform packages ship a raw
  # executable, and resolveBinary() (packages/css-engine/src/index.ts) resolves
  # its path via the optionalDependency package. Same 4 platforms as the server
  # native matrix. The dev/monorepo path uses the workspace `target/` fallback.
  # ---------------------------------------------------------------------------
  build-css-native:
    name: Build css-engine ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    # Longest observed run of this job is ~3 min; without a bound a hang
    # inherits GitHub's 360 min default and stalls the release for six hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            platform: darwin-arm64
            bin-file: aihu-css-compile
            ext: ''
          # x86_64 darwin cross-target on macos-14 (macos-13 EOL'd 2025-12-04;
          # LLVM cross-compiles darwin-on-darwin natively with the stdlib added).
          - runner: macos-14
            target: x86_64-apple-darwin
            platform: darwin-x64
            bin-file: aihu-css-compile
            ext: ''
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64-gnu
            bin-file: aihu-css-compile
            ext: ''
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            platform: win32-x64-msvc
            bin-file: aihu-css-compile.exe
            ext: '.exe'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable @ 2024-10-25
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}

      - name: Build release binary (cargo)
        # aihu-css-core is a member of the root Cargo workspace; cargo emits the
        # `aihu-css-compile` [[bin]] to the workspace-root ./target.
        run: cargo build --release --target ${{ matrix.target }} -p aihu-css-core --bin aihu-css-compile

      - name: Stage binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.bin-file }} ${{ matrix.bin-file }}
          chmod 0755 ${{ matrix.bin-file }}

      - name: Stage binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item -Path "target/${{ matrix.target }}/release/${{ matrix.bin-file }}" -Destination "${{ matrix.bin-file }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: css-native-${{ matrix.platform }}
          path: ${{ matrix.bin-file }}
          if-no-files-found: error
          retention-days: 7

  publish-css-native:
    name: Publish @aihu/css-engine-* platform packages
    needs: build-css-native
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    # Longest observed run of this job is ~3 min; without a bound a hang
    # inherits GitHub's 360 min default and stalls the release for six hours.
    timeout-minutes: 20
    # Native platform packages publish on stable tags only; see publish-native.
    if: inputs.is_release && !inputs.canary
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Download all css-native artifacts
        uses: actions/download-artifact@v8
        with:
          path: css-native-artifacts

      - name: Stage and publish each platform package (idempotent)
        run: |
          set -euo pipefail
          for dir in packages/css-engine/npm/*/; do
            platform=$(basename "$dir")
            # The css binary is a raw executable named aihu-css-compile[.exe];
            # match either to be platform-agnostic in the copy.
            bin_file=$(ls css-native-artifacts/css-native-$platform/aihu-css-compile* 2>/dev/null || true)
            # HARD FAIL, not silent skip: a missing binary here would publish
            # an empty platform package and brick install resolution for that
            # platform (see publish-css-native's comment on why this
            # loop's OWN prior silent-skip shape was the anti-pattern).
            if [ -z "$bin_file" ]; then
              echo "::error::no css binary artifact for $platform (expected css-native-artifacts/css-native-$platform/aihu-css-compile*)"
              exit 1
            fi
            dest="$dir/$(basename "$bin_file")"
            cp "$bin_file" "$dest"
            # Restore +x lost in actions/download-artifact@v8 (does NOT preserve
            # POSIX mode bits). Without this, the published tarball ships
            # aihu-css-compile as -rw-r--r--, and Bun consumers cannot fix it
            # (postinstall is blocked by default for untrusted deps). Skip
            # win32-x64-msvc — NTFS has no exec bit, and the publish job runs
            # on Linux anyway so chmod on a .exe is meaningless.
            case "$platform" in
              win32-*) ;;
              *) chmod 0755 "$dest" ;;
            esac
            # Final guard: the staged file must be non-empty before publish.
            if [ ! -s "$dest" ]; then
              echo "::error::staged binary is empty: $dest (platform $platform)"
              exit 1
            fi
            pkg_name=$(node -p "require('./$dir/package.json').name")
            pkg_version=$(node -p "require('./$dir/package.json').version")
            # Idempotency: skip if this version is already on npm (re-run / retag).
            existing=$(npm view "${pkg_name}@${pkg_version}" version 2>/dev/null || true)
            if [ -n "$existing" ]; then
              echo "${pkg_name}@${pkg_version} already published — skipping"
              continue
            fi
            ( cd "$dir" && npm publish --access public )
          done
