name: Storybook — a11y + interaction + required-story gate
# Plan 6 (master spec §10.2–10.3, §12.3): builds apps/storybook, enforces the
# required-story-set gate, then runs the test-runner (play functions + axe)
# against the static build. Axe failures block merge.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/primitives/**'
      - 'packages/ui/**'
      - 'packages/css-engine/**'
      - 'apps/storybook/**'
      - 'scripts/check-required-stories.ts'
      - '.github/workflows/storybook.yml'
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# Least-privilege floor (CodeQL: Workflow does not contain permissions). No
# job here pushes commits, comments, or writes releases/packages — read-only
# GITHUB_TOKEN covers checkout + the actions used.
permissions:
  contents: read
jobs:
  changes:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      storybook: ${{ steps.filter.outputs.storybook }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            storybook:
              - 'packages/primitives/**'
              - 'packages/ui/**'
              - 'packages/css-engine/**'
              - 'apps/storybook/**'
              - 'scripts/check-required-stories.ts'
              - '.github/workflows/storybook.yml'

  storybook:
    needs: changes
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
      && (github.event_name != 'pull_request' || needs.changes.outputs.storybook == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
      # Storybook is a framework consumer. Its .aihu transforms use the
      # locked, published @aihu/compiler package.
      - run: bun install --frozen-lockfile
      - name: Build workspace packages
        run: bun run build
      - name: Install Playwright chromium (version matched to the lockfile)
        # Bare `bunx playwright` fetches the LATEST playwright (it is only a
        # transitive dep, so no .bin link exists), whose browser revision
        # differs from what the test-runner's pinned playwright-core expects
        # ("Executable doesn't exist at …"). Read the lockfile-resolved version
        # out of bun's store and install exactly that.
        run: |
          PW_VERSION=$(ls node_modules/.bun | grep -oE '^playwright@[0-9][0-9.]*' | head -1 | cut -d'@' -f2)
          echo "playwright (lockfile) = ${PW_VERSION}"
          test -n "$PW_VERSION"
          bunx "playwright@${PW_VERSION}" install --with-deps chromium
      # Build Storybook + required-story-set gate (spec §10.2) + serve + the
      # test-runner (play functions + axe, spec §10.2–10.3), as one command.
      # Those four steps used to be hand-sequenced here with the server left
      # unreaped; scripts/check-storybook-a11y.sh owns the sequence now so the
      # merge gate is reproducible locally as `bun run check:a11y`. Playwright
      # chromium is installed by the step ABOVE, deliberately not by the script.
      - name: Storybook a11y + interaction gate (spec §10.2–10.3)
        run: bun run check:a11y
      # REDUNDANT ON PURPOSE — check:a11y already ran this, against the same
      # built index, before the test-runner. It stays as its own step because
      # scripts/check-gate-wiring.ts establishes reachability by reading
      # workflow `run:` BODIES, not shell scripts: folding the invocation into
      # check-storybook-a11y.sh makes check:stories look like an orphan (a gate
      # no CI path invokes) and turns that meta-check red. Costs <1s — it only
      # re-reads storybook-static/index.json.
      - name: Required-story-set gate (spec §10.2) — reachability anchor
        run: bun scripts/check-required-stories.ts

  storybook-ok:
    # Single stable status for branch protection (mirrors plan-a's ci-ok):
    # green when the storybook job passed OR was path-skipped.
    needs: [storybook]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gate on storybook result
        run: |
          result="${{ needs.storybook.result }}"
          echo "storybook result: $result"
          if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
            echo "::error::Required job 'storybook' did not pass (result=$result)."
            exit 1
          fi
          echo "storybook-ok: storybook=$result — gate green"
