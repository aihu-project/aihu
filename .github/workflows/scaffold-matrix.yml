name: Scaffold DX matrix
# End-to-end first-impression gate: `npm create aihu` → install → typecheck →
# build → dev server answering HTTP 200 → production preview answering HTTP 200,
# across bun / npm / pnpm / yarn and every scaffold template.
#
# Deliberately NOT part of plan-a.yml's `check` job: a full grid installs from
# the live npm registry once per cell and takes tens of minutes, which is far
# too slow for the per-PR path. `ci-ok` (the sole required status for branch
# protection) is untouched by this file and must stay that way.
#
# Runs on a schedule so a broken publish is caught within a day, and is
# workflow_dispatch-able so a release can be verified the moment it lands.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'npm (published packages) or local (this checkout)'
        type: choice
        options: [npm, local]
        default: npm
      version:
        description: 'Published version to test in npm mode (e.g. latest, 1.0.2)'
        type: string
        default: latest
      pm:
        description: 'Comma-separated package managers (default: all four)'
        type: string
        default: bun,npm,pnpm,yarn
      template:
        description: 'Comma-separated templates (default: all)'
        type: string
        default: minimal,full,docs,agent,cf-team
  schedule:
    # 07:00 UTC daily — after a typical release window, before the workday.
    - cron: '0 7 * * *'
  # Changes to the harness, to the scaffold templates it covers, or to any
  # package a scaffolded app actually RUNS must re-prove themselves; everything
  # else stays off this expensive path.
  #
  # The cli/create-aihu/templates trio was the original list, and it had a
  # structural blind spot: it names the packages that WRITE a scaffold and none
  # of the packages a scaffold DEPENDS ON. Three real defects shipped through
  # that gap — un-stripped TypeScript on vite 8, a
  # module-scope top-level await that deadlocked the built Worker
  # (`packages/app`), and an SSR response that was a bare fragment
  # (`packages/app` + `packages/server`). Every one of them is a first-run
  # failure for a consumer; none of them touches a file in the old list, so this
  # workflow never ran on the PRs that introduced them.
  #
  # See docs/plans/2026-08-08-ssr-vite-remediation.md §"The gate gap is specific".
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'packages/cli/**'
      - 'packages/create-aihu/**'
      - 'packages/templates/**'
      # Packages a scaffolded app runs. A change here can break `bun run build`
      # in a fresh consumer tree while every in-repo test stays green, because
      # the repo's own node_modules layout is not the one a consumer installs.
      - 'packages/app/**'
      - 'packages/router/**'
      - 'packages/server/**'
      - 'packages/adapter-cloudflare/**'
      - '.github/workflows/scaffold-matrix.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# A scheduled run and a dispatch racing each other would fight over the npm
# cache for no benefit.
concurrency:
  group: scaffold-matrix-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege floor (CodeQL: Workflow does not contain permissions). No
# job here pushes commits, comments, or writes releases/packages — read-only
# GITHUB_TOKEN covers checkout + the actions used.
permissions:
  contents: read
jobs:
  matrix:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # Generous: every cell installs from the live registry and boots two servers.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      # moon/proto is the SINGLE toolchain source (moon is needed anyway: the
      # cf-team template's scripts shell out to it — the only cell exercising
      # `aihu app --template <id>` resolving a template package FROM npm; without
      # moon it SKIPs, and since #613 a skip exits GREEN, a false negative nobody
      # can see). `.prototools` pins node=22.12.0, so proto installs and SHIMS
      # node here.
      #
      # FEL-MATRIX-PROTO — ORDER IS THE FIX, and it is counter-intuitive, so
      # read this before touching either step.
      #
      # The scaffolds under test are ordinary standalone projects in /tmp. They
      # need *a* node; they do not need proto's node. moon is needed only so the
      # cf-team cell's scripts can shell out to it.
      #
      # `proto` SHIMS node. When the resolved `node` on PATH is itself a proto
      # shim, proto refuses to exec it rather than recurse, and every child
      # process a package manager spawns (`sh -c node install.js` for esbuild's
      # postinstall, `vite`, yarn's own `#!/usr/bin/env node` launcher) dies with:
      #
      #   Error: proto::commands::run::fallback_loop
      #   x Unable to run node, as the global executable found at <path>
      #     is a proto shim, which would trigger a recursive execution loop.
      #
      # Measured, not inferred — two runs, same harness:
      #   setup-node THEN setup-toolchain  -> collides at /opt/hostedtoolcache/node/...
      #                                       run 30318406544: 13/15 red, ALL at pm-install
      #   setup-toolchain, no setup-node   -> collides at /usr/local/bin/node
      #                                       run 30321617019: 13/15 red, npm still at install
      # Deleting setup-node MOVED the collision; it did not remove it. So the
      # cause is not "a second store" — it is that the winning `node` on PATH is
      # a shim at all.
      #
      # Hence: setup-toolchain FIRST (moon on PATH for cf-team), then put the
      # current Bun ahead of proto's pinned Bun (1.3.8 stalls resolving the
      # cf-team workspace), and finally setup-node so a REAL node binary wins
      # ahead of proto's shims. Do not swap these back.
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # pnpm and yarn are not on the ubuntu-latest image by default. This MUST
      # run after setup-node: on run 30321617019 it ran under proto's npm,
      # reported "added 2 packages" — and `pnpm --version` was still EMPTY,
      # because the globals landed in proto's node prefix, which is not exported
      # onto PATH. The step passed while achieving nothing, and the pnpm row went
      # on saying SKIP. Under setup-node's node the prefix IS on PATH.
      #
      # A skipped row is NOT a pass — the harness says so out loud — so a silent
      # absence here quietly shrinks the grid instead of failing it.
      - name: Install pnpm and yarn
        run: npm install --global pnpm yarn

      - name: Report toolchain
        run: |
          echo "bun  $(bun --version)"
          echo "npm  $(npm --version)"
          echo "pnpm $(pnpm --version)"
          echo "yarn $(yarn --version)"
          echo "node $(node --version)"
          # Loud on purpose. If moon is missing the cf-team cell skips green,
          # so its absence must be visible in the log rather than inferred from
          # a grid row that quietly says SKIP.
          echo "moon $(moon --version 2>/dev/null || echo 'MISSING — cf-team will SKIP')"

      # Only needed for --mode local; harmless (and fast) otherwise.
      #
      # This condition MUST stay in step with the --mode expression below.
      # `inputs.mode` is empty on `pull_request`, so a PR run resolves to
      # 'local' — and without this build there would be no packages/cli/dist
      # for local mode to drive. Two expressions, one meaning: keep them
      # together or the gate silently tests nothing.
      - name: Build @aihu/cli
        if: ${{ inputs.mode == 'local' || github.event_name == 'pull_request' }}
        run: |
          bun install --frozen-lockfile
          bun run --cwd packages/cli build

      - name: Run scaffold DX matrix
        # `--mode local` alone only decides WHICH CLI BINARY scaffolds (this
        # branch's packages/cli/dist vs. published create-aihu) — it says
        # nothing about how the SCAFFOLDED PROJECT resolves its own @aihu/*
        # dependencies. Without --local-pkg too, a PR run wrote this branch's
        # real (possibly unpublished) workspace version into package.json —
        # correct — and then tried to `npm install`/`pnpm install` that exact
        # version from the real registry — which 404s until the next release
        # actually publishes it. Every PR run failed on this, unconditionally,
        # the mirror image of the bug scaffold-consistency's own job comment
        # (plan-a.yml) already documents and fixes for its own two steps; that
        # fix was never mirrored here. `--local-pkg` is empty (equivalent to
        # omitted — scaffold-matrix-e2e.ts filters blank entries) outside PR
        # mode, so a scheduled/dispatched `npm` run still tests the real
        # published registry end to end, unchanged.
        #
        # `all`, not a list: the hand-written list this replaced covered 12 of
        # the 36 packages a scaffold can declare, and the 24 it missed kept
        # resolving from the registry — invisible until `changeset version`
        # moved one past what is published, at which point the Version PR (and
        # only the Version PR) failed on a package nobody had thought to list.
        # See discoverAllLocalPkgs() in scaffold-matrix-e2e.ts.
        run: |
          bun packages/cli/tests/scaffold-matrix-e2e.ts \
            --mode "${{ inputs.mode || (github.event_name == 'pull_request' && 'local' || 'npm') }}" \
            --version "${{ inputs.version || 'latest' }}" \
            --pm "${{ inputs.pm || 'bun,npm,pnpm,yarn' }}" \
            --template "${{ inputs.template || 'minimal,full,docs,agent,cf-team' }}" \
            --local-pkg "${{ (inputs.mode == 'local' || (inputs.mode == '' && github.event_name == 'pull_request')) && 'all' || '' }}" \
            --cmd-timeout 300000 \
            --server-timeout 120000 \
            2>&1 | tee scaffold-matrix.log
          # tee makes ${PIPESTATUS[0]} the harness's own exit code; `$?` would be
          # tee's and would turn every failure into a green run.
          exit "${PIPESTATUS[0]}"

      - name: Upload matrix log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scaffold-matrix-log
          path: scaffold-matrix.log
          retention-days: 14
