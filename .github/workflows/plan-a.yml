name: Plan A — TS runtime family
# Auto-triggers re-enabled at v1 cutover (Plan 7.1, 2026-05-03).
on:
  workflow_dispatch:
  push:
    branches: [main]
    # MUST mirror the `code` filter's exclusion list below (FEL-433 half-2),
    # not a blanket '**/*.md' — a push touching only skills/aihu/**.md (real
    # compiler input check:skill-samples validates, not documentation) used
    # to skip this workflow entirely on a push to main while a PR touching
    # the identical files correctly ran full CI, reopening on the push side
    # exactly the doc-only-skip hole FEL-433 closed on the PR side.
    paths-ignore:
      - '.team/**'
      - 'docs/**'
      - '.claude/**'
      - 'state-*.md'
      - 'README.md'
      - '**/README.md'
      - '**/CHANGELOG.md'
      - '.changeset/**'
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    # No paths-ignore here: the workflow must trigger on EVERY PR so the
    # always-on `ci-ok` job reports a required status for branch protection.
    # Doc-only PRs skip the heavy `check` job via the `changes.code` filter
    # below (so they cost only `changes` + `ci-ok`, a few seconds), and `ci-ok`
    # still reports green so the PR is mergeable without an admin override.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# Least-privilege floor (CodeQL: Workflow does not contain permissions). No
# job here pushes commits, comments, or writes releases/packages — read-only
# GITHUB_TOKEN covers checkout + the actions used.
permissions:
  contents: read
jobs:
  check:
    # Skip CI on draft PRs to keep the inner Builder loop cheap.
    # Skip the heavy build on doc-only PRs (changes.code == 'false') — the
    # always-on `ci-ok` job still reports green for branch protection.
    # Push-to-main and ready-for-review code PRs still gate.
    needs: changes
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
      && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
      # css-engine remains in this repository, so its native binary is built
      # here. The SFC compiler is published by aihu-compiler and is resolved
      # from the locked @aihu/compiler dependency.
      - name: Cache Rust build (css-engine dependencies)
        uses: Swatinem/rust-cache@v2
      - name: Build css-engine binary
        run: cargo build --release -p aihu-css-core
      - run: bun install --frozen-lockfile
      # One Rust pin, enforced: rust-toolchain.toml is the source of truth and
      # every other copy (.prototools, the dtolnay steps, RUSTUP_TOOLCHAIN)
      # must match it EXACTLY. Cheap, and it runs before anything expensive.
      - run: bun run check:rust-pin
      - run: bun run check:deps
      # Guard (FEL-411): the Moon project graph must describe the REAL
      # build-order dependencies, DERIVED from what each package imports. A
      # missing edge (e.g. editor imports @aihu/compiler but omitted it from
      # dependsOn) lets `typecheck` race ahead of the dependency's `build`,
      # failing TS2307 nondeterministically. Reads only source + moon.yml text,
      # so it runs with the other cheap graph guards, before typecheck.
      - run: bun run check:moon-graph
      # Guard: a css-engine / server native change must bump those platform
      # binary packages, or the rebuilt binary is silently skipped at publish
      # (see the scripts). The css-engine one was added after it went stale
      # silently for weeks — see that script's own history.
      #
      # The COMPILER equivalent is deliberately absent: compiler platform
      # versions are now generated under lockstep, so there is no hand bump to
      # demand. Its two replacements — check:platform-version-sync and
      # check:native-changeset — are always-on jobs of their own rather than
      # steps here, so they also run on draft PRs and when `changes.code` is
      # false. css-engine and server join them in Phase 1b.
      - run: bun run check:css-engine-binary-bump
      - run: bun run check:server-binary-bump
      # Guard: every non-private package under packages/ must be in
      # publish-all.sh's hand-maintained PKGS array, or changesets bumps it
      # forever while it never reaches npm — silently, with the release job
      # green throughout. Has already bitten ui, seo, store, editor and magna.
      # Reads only manifest text, so it runs with the other cheap guards.
      - run: bun run check:publish-manifest
      # Every ```aihu fence in skills/aihu/**.md must compile, and every
      # ```aihu-error fence must fail to compile. That skill is what teaches a
      # coding agent `.aihu` syntax — if its samples rot, every agent working in
      # an aihu project is taught code the compiler rejects.
      #
      # The checker resolves the locked published compiler package, matching
      # the compiler version Aihu applications receive.
      #
      # The gate carries its own floor assertion: it fails if it finds fewer
      # samples than expected, so a renamed fence or moved file cannot make it
      # pass by checking nothing.
      - run: bun run check:skill-samples
      # NOTE: the lesson-citation gate is deliberately NOT here — see the
      # `lesson-refs` job below. This `check` job IS skipped on doc-only PRs via
      # `changes.code` (FEL-433 made that filter discriminate — it previously ran
      # on everything). A docs-facing gate therefore must NOT be a step here, or
      # it would silently skip on the doc-only PRs it most needs to run on; it
      # goes in its own always-on job instead.
      # @aihu/use registry parity — a composable's six touch points (src dir,
      # barrel, package.json exports, rolldown input, .size-limit.json row,
      # USE_COMPOSABLES tuple) must all agree, bidirectionally. Needs no build
      # output — only reads source/manifest text — so it runs early, right
      # after the other cheap Rust-source-adjacent guard above and before the
      # full build+coverage run, to fail fast and cheaply on a forgotten
      # touch point.
      - run: bun run check:use-registry-parity
      # LSP composable-registry parity (FEL-342) — packages/language-server's
      # completion/hover table is GENERATED from the same USE_COMPOSABLES this
      # repo just checked above, plus each composable's own doc comment. Same
      # cheap, no-build-output shape as the guard above; catches a forgotten
      # `bun run gen:composable-registry` after adding/renaming a composable
      # or editing its doc comment.
      - run: bun run check:composable-registry
      # Generated-artifact drift guards for @aihu/css-engine's Rust-derived
      # tables — same shape as check:composable-registry above (a committed TS
      # module generated from the compiler binary's own data, never
      # hand-written), so they run right after it. Both invoke
      # aihu-css-compile directly (see each script's header), which "Build
      # Rust binaries" already staged at target/release/ above, so no extra
      # build step is needed here.
      #
      # check:cn-map — the `cn()` conflict map is generated from
      # tokens::conflict_groups(); a Rust utility-registry edit (e.g. new
      # animate-* entries) that forgets `bun run gen:cn-map` ships silently
      # stale until the next publish. Previously only ran at prepublishOnly
      # with no CI drift check (see gen-cn-conflict-map.ts's header) — wired
      # in now because chain membership in `check:ci` (invoked by no
      # workflow) proved nothing (C-FEL-428).
      - run: bun run check:cn-map
      # check:animations-gallery — the Storybook demo gallery's data
      # (tailwind-animations port Track A Slice 14) is pre-compiled at
      # generation time from animations::ANIMATIONS, since the gallery's
      # plain-HTML story is never scanned by the aihuCompilerPlugin (see
      # gen-animations-gallery.ts's header). Same C-FEL-428 orphan history as
      # check:cn-map above — was reachable only via the inert check:ci chain.
      - run: bun run check:animations-gallery
        # Use the pinned local biome (node_modules/.bin via check:lint), NOT
        # `bunx biome`, which resolves its own latest copy and made CI flap when
        # biome 2.4.15 published mid-day (see PR pinning @biomejs/biome to 2.4.14).
      - run: bun run check:lint
      # README autogen sync moved OUT of this job to its own always-on
      # `readme-sync` job (C-FEL-READMESYNC-JOB). It is a DOCS-FACING gate — it
      # consumes root + every packages/**/README.md — and `check` now skips
      # doc-only PRs (FEL-433 `code` filter), so as a step here it silently
      # stopped running on the README-only PRs it exists to catch. Exactly the
      # misplacement the NOTE above (check:skill-samples) warns against.
      - run: bun run typecheck
      # Slice 0 — thesis invariants (docs/architecture/thesis.md §Invariants).
      # Each converts a property from "true today if you check" into "cannot
      # silently stop being true". All four FAIL against the tree today, at the
      # counts committed in docs/plans/slice-0-invariants/baselines.json — and
      # they gate anyway, because each exits 0 iff its finding count EQUALS its
      # baseline. A count that rises is a new violation; a count that falls is
      # also red, forcing the baseline decrement into the same PR as the fix.
      # An invariant parked outside CI protects nothing, which is the failure
      # mode check:emit-parses is in right now.
      #
      # Placed after typecheck and before test deliberately: these are cheaper
      # than the coverage run and catch a class the suites cannot, so they
      # should fail fast. Every check runs its own bidirectional self-test
      # (should-flag AND should-not-flag) before it scans the real tree, and
      # exits 1 on zero inputs rather than passing vacuously.
      #
      # check:agent-conformance is NOT here — it generates, builds and serves an
      # app, and lands as its own job once its baseline is measured (spec §Phase 2).
      - run: bun run check:derived
      - run: bun run check:attributed
      - run: bun run check:governed
      - run: bun run check:dual-audience
      # emit-parses (#453) — compile EVERY cookbook + examples/**/ .aihu fixture
      # and assert the emitted JS actually parses. The compiler test suites only
      # assert emitted output *contains* substrings; nothing proved it parsed,
      # which let five invalid-output bugs ship at once (see the script header).
      # As of #425/#449 the baseline is 0 compile / 0 parse across 58 components,
      # so it gates at --expect-parse 0 --expect-compile 0: any example or
      # component that stops compiling — or any emitter regression that produces
      # unparseable JS — fails the build, and a count that drifts either way is
      # red. Parked outside CI until now (investigation note in #445); an
      # invariant not wired in protects nothing.
      #
      # Runs here with the rest of the Slice-0-style compile invariants: it needs
      # the published @aihu/compiler binary, and no built dist, so it can fail fast
      # before the coverage run.
      - run: bun scripts/check-emit-parses.ts --expect-parse 0 --expect-compile 0
      # cookbook corpus (P0 — corpus unification): the cookbook is the single
      # source of truth for every fluency surface. check:cookbook validates the
      # <!-- @cookbook --> frontmatter schema on all recipes and diffs the three
      # generated artifacts (mcp cookbook-index.json, llms-cookbook.txt,
      # playground presets.generated.ts) against a fresh build — a stale or
      # hand-edited artifact is a red PR, which is what prevents the pre-#497
      # fossil-index state from recurring. test:cookbook is the compile harness
      # (uses the same published compiler as emit-parses).
      - run: bun run check:cookbook
      - run: bun run test:cookbook
      # governed examples (Phase 2a — governed set + coverage matrix): asserts
      # each governed example's coverage.manifest.json only claims construct rows
      # its own source actually contains (detectors in the script), and that the
      # union of manifests still covers the MUST_BE_LIVE floor. A manifest that
      # over-claims, or an edit that deletes a row's only live exerciser, is red —
      # so a coverage regression is attributable to a named example + row. Pure
      # TS, no build; runs with the other always-on invariants. The full row
      # universe incl. gaps is cookbook/COVERAGE-MATRIX.md (the Phase 2b backlog).
      - run: bun run check:coverage-manifest
      # CLI templates B1.3 — scaffold-and-compile harness exercises the
      # template against an isolated tmpdir and asserts typecheck passes
      # against the emitted scaffold. Skipped on Windows runners (matches
      # the test-level skip in scaffold-and-compile.test.ts; bun + symlink
      # behavior on Win is unreliable for this harness). legacy-snapshot
      # is platform-agnostic and always runs.
      - if: runner.os != 'Windows'
        run: bun run test packages/cli/tests/scaffold-and-compile.test.ts
      # legacy-snapshot (#434/#445): the root vitest config EXCLUDES this test
      # (so the coverage run below doesn't double-run it), which used to defeat
      # this step's explicit file filter — "No test files found, exiting 0", a
      # vacuous pass that let the #395 golden drift land unnoticed. The gates
      # config is the root config minus that exclude; passWithNoTests:false at
      # root AND in the gates config makes a zero-test selection exit 1.
      - run: bun run test packages/cli/tests/legacy-snapshot.test.ts --config vitest.gates.config.ts
      # loadAihuConfig() runs Vite's config bundler (rolldown). Under the main
      # `test --coverage` run that prevented the suite from exiting — the job
      # hit its 25m ceiling with no failing assertion. Opt-in via env, and run
      # here as its own step so the loader is still genuinely exercised.
      - run: bun run test packages/app/tests/load-config.test.ts
        env:
          AIHU_CONFIG_LOADER_E2E: '1'
      # The compiler lives in its own repository. This proves consumers resolve
      # the npm package and platform binary, rather than falling back to the
      # retained packages/compiler source tree during the extraction.
      - run: bun run test:compiler-registry
      - run: bun run test --coverage
      - run: bun run build
      # The governed example lane consumes these exact outputs rather than
      # rebuilding the workspace from the same commit. Stage them under an
      # explicit `packages/` root: upload-artifact strips the common prefix of
      # wildcard paths, which otherwise restores `*/dist` at the repo root.
      - name: Stage workspace build outputs
        run: |
          rm -rf .ci-artifacts/workspace-build
          for package in packages/*; do
            [ -d "$package/dist" ] || [ -d "$package/bin" ] || continue
            mkdir -p ".ci-artifacts/workspace-build/$package"
            [ -d "$package/dist" ] && cp -a "$package/dist" ".ci-artifacts/workspace-build/$package/"
            [ -d "$package/bin" ] && cp -a "$package/bin" ".ci-artifacts/workspace-build/$package/"
          done
      - name: Upload workspace build outputs
        uses: actions/upload-artifact@v7
        with:
          name: workspace-build-${{ github.sha }}
          path: .ci-artifacts/workspace-build
          if-no-files-found: error
          retention-days: 1
      # API datasheet drift, caught on the PR that causes it.
      #
      # The sheets are DERIVED from every documentable package's export surface,
      # so any change to a public interface under packages/*/src makes them
      # stale — five separate times in one week: `SsrOptions.contextSetup`, the
      # `useSwarm` removal, `SsrOptions.wrapTag`, `DefineOptions.hydrate`, and
      # arbor's new `./hydrate` subpath. Each was caught only by the docs deploy
      # workflow, i.e. AFTER the causing change had already landed on main, so
      # the next unrelated PR inherited a red gate.
      #
      # MUST come after `bun run build` above: for a package whose `exports`
      # target has no `src/` sibling, gen-api falls back to the built
      # `dist/*.d.ts`, and a tree with no dist manufactures false drift. This is
      # the same ordering constraint deploy-docs.yml documents on its own copy.
      - name: API datasheets are up to date
        run: bun scripts/gen-api.ts --check
        working-directory: apps/docs
      - run: bun run size
      # v0.2.4 — .size-limit.json row-policy lint. Flags any browser-eligible
      # package missing a row, or any server-side / build-dev-time-only package
      # with a forbidden row. See .size-limit.README.md for the policy. The
      # parent workflow runs on workflow_dispatch only; push triggers re-enable
      # at v1.0.1 per state-plan-a.md "Open follow-ups".
      - run: bun run check:size-rows
      # Runtime portability purity (Bug-4 client-leak regression). Asserts the
      # runtime-agnostic / browser / edge entries (server main, app main + app
      # client) carry NO node: builtin import. The only node:module-bearing
      # artifact allowed is @aihu/server's dist/native.js (the explicit
      # @aihu/server/native boundary). Blocks the @aihu/app@0.1.8-class leak
      # before publish. See investigation 4a796a8f-0f2b-4865-a498-73cf11b6f04c.
      - run: bun run check:runtime-purity
      # check:grammar-v2 is deliberately NOT a step here yet, and the reason is
      # recorded in scripts/gate-wiring-baseline.json rather than left to be
      # rediscovered. Short version: it had never run in CI (its only route was
      # `check:ci`, which no workflow invokes), and the moment you run it, it is
      # RED on five FALSE positives — comments and strings that DESCRIBE the
      # retired forms, including one warning string that tells users not to use
      # them. Third instance of the #681/#689 class: a regex over raw source
      # cannot tell code from text about code. Fixing that needs per-file-type
      # judgement (a retired form in an .aihu file IS a use), so it is its own
      # contract. Listed as KNOWN-ORPHAN DEBT until then — which at least prints
      # on every run, unlike the dead chain that was hiding it.

  # ---------------------------------------------------------------------
  # DO NOT add a `name:` to this job.
  #
  # Branch protection stores the CHECK-RUN name, which GitHub derives from a
  # job's `name:` if present and falls back to the job id otherwise. Protection
  # currently matches the literal id `ci-ok`. Adding `name: CI OK` — even as a
  # cosmetic tidy — renames the check-run, the required context `ci-ok` then
  # never reports, and protection silently detaches: PRs stay mergeable with
  # nothing enforced and no error anywhere.
  #
  # The failure produces silence rather than a signal, which is why it needs to
  # be written down next to the thing it protects rather than remembered.
  # ---------------------------------------------------------------------
  lesson-refs:
    # Every docs/lessons/*.md path cited anywhere under docs/ must exist in the
    # tree. A citation is a claim; an unreachable one fails like a dead binding —
    # quietly, and in the flattering direction.
    #
    # WHY ITS OWN JOB, and not a step in `check` — the reasoning was corrected
    # once, so the corrected version is what is written here:
    #
    # `check` is gated on `changes.code`, which excludes 'docs/**' and doc
    # markdown. Since FEL-433 that filter actually DISCRIMINATES: the `code`
    # step uses `predicate-quantifier: every` so a docs-only PR yields
    # code=false and `check` is skipped (verified with picomatch 4.0.5 under
    # dorny's MatchOptions). So a docs gate placed as a step inside `check`
    # would silently NOT run on the doc-only PRs it most needs to catch. This
    # job depends on none of that: no `if:`, no path filter, always runs. It
    # needs only git and bash — no bun install, no build, no Rust — so it costs
    # seconds.
    #
    # (Before FEL-433 the filter was INERT — dorny defaults to
    # `predicate-quantifier: some` and the leading '**' matched every file, so
    # `code` was true for everything and `check` ran even on doc-only PRs. A
    # step here worked then only by that accident; the own-job design was
    # already correct and is now load-bearing.)
    #
    # `check:ci` in package.json also lists it, for local pre-push. That is NOT
    # what makes it run: `check:ci` is invoked by no workflow in this repo. THIS
    # job is the wiring. (check:skill-samples sat unwired for a while on exactly
    # that misunderstanding; #615 fixed it.)
    #
    # Compares against HEAD, not origin/main: a main-based gate on a PR that ADDS
    # a lesson could never go green — a gate that cannot pass is as useless as
    # one that cannot fail. `LESSON_REFS_BASE=origin/main` is the separate
    # publication check, run by hand before citing a lesson outside this repo.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/check-lesson-refs.sh

  palette:
    # The brand palette that SHIPS must match the brand contract, or the
    # difference must be recorded (FEL-435).
    #
    # Two checks, and the second exists because of what the first could not see.
    # `check_contrast.py` audits `.tastemaker/style-lock.md`, and audits it
    # faithfully — 27 of its 30 lock-derived values were exact transcriptions.
    # What nothing audited was `packages/css-engine/src/packs.ts`, the palette a
    # user actually receives. Both artefacts were internally consistent and no
    # gate compared them, so `accent`/`border` reported 3.62 (+0.62 over the 3.0
    # ui-safe floor) while the shipped pairing is 3.12 (+0.12). The number was
    # right about the contract and silent about the product.
    #
    # WHY THIS JOB EXISTS AT ALL: `style-lock.md` mandates "re-run
    # check_contrast.py with the new token, don't eyeball it" — and NOTHING RAN
    # IT. `grep -rn check_contrast .github/ package.json scripts/` returned
    # nothing; every reference to it was prose. A mandated verification that no
    # gate performs is a gate that cannot fail, so the wiring lands in the same
    # commit as the check rather than being left for later.
    #
    # Own job, no `if:`, no path filter — historian's `lesson-refs` pattern, for
    # the same reason: `check` is gated on `changes.code`, which since FEL-433
    # discriminates (`predicate-quantifier: every`) and so SKIPS doc-only PRs. A
    # palette gate as a step in `check` would not run on a doc-only PR; as its
    # own always-on job it always does. Needs python3 and two files: seconds, no
    # install, no build, no Rust.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # The lock's own mandated tool. Exits 1 if any claimed pairing fails.
      - run: python3 .tastemaker/check_contrast.py --pairings
      # Lock vs shipped pack. Green when divergences match the recorded set; RED
      # on a new one AND on a recorded one that has quietly been fixed. Prints
      # the recorded set as DEBT every run so it cannot go quiet. Deliberately
      # not permanently red — that is the state that gets a gate disabled.
      - run: python3 .tastemaker/check_palette_parity.py --verbose

  readme-sync:
    # README autogen sync — the generated sections of root README.md and every
    # packages/**/README.md must match their canonical sources, or
    # `bun scripts/sync-readme.ts` was not re-run. Its OWN always-on job, on the
    # lesson-refs pattern, because it is a DOCS-FACING gate: it consumes READMEs,
    # which the `code` filter correctly excludes, so a README-only PR yields
    # code=false and skips `check`. It lived as a STEP inside `check` until
    # C-FEL-READMESYNC-JOB, where it silently stopped running on exactly the
    # README-only PRs it exists to catch the moment FEL-433 made the filter
    # discriminate. No `if:`, no path filter — it runs on every PR.
    #
    # Cheap like lesson-refs: `sync-readme --check` READS the committed
    # scripts/__bundle-sizes.json cache and never bundles, so it needs bun + the
    # repo but NO `bun install`, no build, no Rust. (The `rolldown` import it
    # once loaded statically at module top is now lazy — reached only in the
    # --remeasure/write path; see scripts/sync-readme.ts.) The husky pre-commit
    # hook also runs it, but that is --no-verify-bypassable and routinely
    # bypassed for docs, so it is NOT a substitute for this CI gate.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'
      - run: bun scripts/sync-readme.ts --check

  gate-wiring:
    # The FEL-428 meta-gate: every check:* gate must be invoked by some CI path,
    # and its red path must have been EXECUTED and observed to exit non-zero.
    #
    # THIS JOB IS THE POINT (C-FEL-GATE-WIRING-RUNS). #680 shipped the meta-check
    # into `check:ci` only, and `check:ci` is invoked by no workflow in this repo
    # — the lesson-refs comment above already said so. So `grep -rn gate-wiring
    # .github/` returned nothing and the gate that exists to forbid
    # green-by-construction gates was one. It scored ITSELF reachable because its
    # rule counted check:ci-chain membership, a fact about package.json rather
    # than about CI. That rule is now conditional on a workflow actually invoking
    # check:ci, so THIS JOB is what makes it honest — delete it and the
    # meta-check reports itself an orphan (proven; that is a negative fixture).
    #
    # WHY ITS OWN JOB AND NOT A STEP IN `check`, corrected. My first version of
    # this comment said the `code` filter does not guarantee package.json /
    # .github/workflows. THAT WAS FALSE and it was measured false: `code` is
    # `**` minus .team, docs, .claude, state-*.md, READMEs, CHANGELOGs and
    # .changeset, so both ARE code. A false premise in a workflow comment is the
    # exact failure this contract is about, so it is corrected rather than
    # quietly dropped.
    #
    # The TRUE reason is the OTHER half of `check`'s `if:` — `draft == false`.
    # A step in `check` is invisible on every draft PR, and agents are instructed
    # to push a draft the moment they make an edit, so a wiring regression would
    # go unseen for the entire life of the branch it was introduced on. This job
    # carries no `if:` and no path filter: it runs on drafts too.
    #
    # Own-job costs THREE coordinated edits — this job, ci-ok's `needs:`, and
    # ci-ok's RESULT LOOP — and this repo has shipped 1+2-without-3 twice (the
    # palette job; #649). That risk is why a step was ruled first. It is now
    # closed IN CODE, not by this comment: check-gate-wiring.ts asserts every job
    # in ci-ok's `needs:` also appears in the result loop, bound to its own
    # result. Drop the loop entry below and the gate goes red.
    #
    # Cheap like lesson-refs/readme-sync — reads text, spawns its own negative
    # fixtures (~2s), needs bun + the repo but NO `bun install`, no build, no Rust.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'
      - run: bun run check:gate-wiring

  template-versions:
    # The scaffold's declared dependency ranges must match the workspace
    # versions they are GENERATED from (scripts/sync-template-versions.ts).
    #
    # WHAT THIS PROTECTS. Every `@aihu/*` entry a scaffold emitted used to be
    # the literal string `"latest"`, and nothing checked it because there was
    # nothing to check it against. Now `packages/cli/src/dep-versions.ts` and
    # cf-team's `apps/web/package.json.tmpl` are derived artifacts, and a
    # derived artifact with no gate is a stale artifact: `release:version` runs
    # the generator, but a hand edit — or a package version bumped without the
    # regen — would sail through review and ship a scaffold pinning versions
    # that do not exist.
    #
    # OWN JOB, on the readme-sync/gate-wiring pattern, for the same measured
    # reason. It reads package.json files and nothing else — no `bun install`,
    # no build, no Rust, ~1s — and carrying no `if:` and no path filter means it
    # also runs on DRAFT PRs, where `check` is invisible. `check:ci` lists it too
    # for local pre-push, but that is not what makes it run: `check:ci` is
    # invoked by no workflow in this repo (see the lesson-refs job). THIS job is
    # the wiring.
    #
    # Own-job costs THREE coordinated edits — this job, ci-ok's `needs:`, and
    # ci-ok's RESULT LOOP (plus the loop's positive-control count). That triple
    # is machine-checked by check:gate-wiring; drop any leg and it goes red.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'
      - run: bun run check:template-versions

  platform-version-sync:
    # GATE A. Every native platform manifest must carry its host's version, and
    # every optionalDependencies pin must point at exactly that.
    #
    # WHAT THIS REPLACES. `check:compiler-binary-bump` demanded a Rust change
    # also hand-edit 23 files (5 CLI manifests + 5 napi manifests + 10 pins +
    # regen). Under lockstep those files are GENERATED by
    # `stamp-platform-versions.ts`, which `release:version` now runs, so the
    # hand edit is neither possible nor meaningful. This checks the INVARIANT
    # the generator establishes instead of policing the keystrokes.
    #
    # It is also strictly stronger than what it replaces. The old guard was pure
    # set-membership over `git diff --name-only`: it never parsed a manifest,
    # never compared a version, and never checked that a pin matched the package
    # it names. Touching all 11 files with a whitespace edit satisfied it. This
    # one compares actual values, and additionally catches a pin naming a
    # platform package no directory produces — invisible to every previous check
    # while still shipping as an unresolvable optionalDependency.
    #
    # Reads package.json files and nothing else — no install, no build, ~50 ms —
    # so it carries no `if:` and no path filter and runs on DRAFT PRs too.
    #
    # OWN-JOB TRIPLE: this job, ci-ok's `needs:`, and ci-ok's RESULT LOOP plus
    # its positive-control count. check:gate-wiring machine-checks all of it.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'
      - run: bun run check:platform-version-sync
      # Every platform pin must resolve in bun.lock. Bun silently OMITS an
      # optionalDependency it cannot resolve, so a pin moved ahead of the
      # registry leaves the lock quietly disagreeing with the manifests --
      # invisible until those versions publish, at which point every PR fails
      # on --frozen-lockfile. That took main down twice (#783, #794).
      #
      # Step 1 of docs/plans/2026-08-10-platforms-before-pins.md: this is the
      # assertion the ordering fix has to keep green THROUGH a Version PR.
      - run: bun run check:lockfile-platform-pins

  native-changeset:
    # GATE B, and it is NOT optional alongside Gate A — Gate A alone would be a
    # net loss.
    #
    # `@aihu/compiler` has NO `@aihu/*` dependencies, so changesets'
    # `updateInternalDependencies: "patch"` never cascades into it: its version
    # moves if and only if a changeset names it. Under lockstep, a Rust change
    # with no changeset leaves the host version unmoved, therefore the platform
    # versions unmoved, therefore release.yml's `npm view` skip declines to
    # publish — and the fix silently never reaches consumers, with Gate A green
    # the entire time. That is FEL-414 reproduced.
    #
    # The old 23-file demand was an accidental PROXY for "somebody thought about
    # shipping this". Removing it without a replacement reopens FEL-414; this is
    # the replacement, and a changeset is a better proof than an edited manifest
    # because it cannot be produced without stating what changed, and its text
    # becomes the CHANGELOG entry.
    #
    # Needs full history: it diffs against the merge base.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'
      - run: bun run check:native-changeset

  alias-parity:
    # The two alias systems — per-package tsconfig `paths` (read by tsc) and
    # root vitest.config.ts `resolve.alias` (read by vitest) — must not disagree
    # about what an `@aihu/*` specifier resolves to.
    #
    # WHAT THIS PROTECTS. The two maps are hand-maintained, serve different
    # purposes, and are deliberately different sizes, so "they drifted" is not
    # visible by reading either one. The failure mode is SILENT IN BOTH
    # DIRECTIONS: a specifier missing from vitest.config.ts does not error, it
    # resolves through package `exports` to that package's `dist` — which exists
    # in any built tree — so the test suite goes green having validated a stale
    # BUILT ARTIFACT instead of the source it is supposed to be testing. And a
    # tsconfig that maps `@aihu/arbor` does NOT thereby cover
    # `@aihu/arbor/hydrate` (TS `paths` matching is exact, not prefix), so a
    # subpath quietly falls back to dist and one package's typecheck validates
    # half of a dependency against a previous build. Neither shows up as a
    # failure anywhere; that is the whole reason this is a gate and not a README
    # paragraph. It also enforces vitest's alias ORDER — vite takes the FIRST
    # prefix match, so a subpath alias listed after its own prefix is
    # unreachable, which three hand-written "Order matters" comments in
    # vitest.config.ts describe and nothing checked.
    #
    # OWN JOB, on the readme-sync/gate-wiring/template-versions pattern, for the
    # same measured reason. It reads tsconfig*.json + vitest.config.ts and
    # nothing else — no `bun install`, no build, no Rust, ~1s — and carrying no
    # `if:` and no path filter means it also runs on DRAFT PRs, where `check` is
    # invisible. `check:ci` lists it too for local pre-push, but that is not what
    # makes it run: `check:ci` is invoked by no workflow in this repo (see the
    # lesson-refs job). THIS job is the wiring.
    #
    # Own-job costs THREE coordinated edits — this job, ci-ok's `needs:`, and
    # ci-ok's RESULT LOOP (plus the loop's positive-control count). That triple
    # is machine-checked by check:gate-wiring; drop any leg and it goes red.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'
      - run: bun run check:alias-parity

  ci-ok:
    # Single stable REQUIRED status for branch protection. Always runs (even
    # when `check` / `examples` / `governed-examples` are skipped — e.g. a
    # doc-only PR skips `check` via the `changes.code` filter, and
    # `governed-examples` skips whenever `changes.governed` is false) so a
    # required context is always reported. Passes when EVERY one of
    # check/examples/governed-examples/lesson-refs succeeded OR was skipped;
    # fails if ANY of them failed or was cancelled. This lets doc-only PRs merge
    # without an admin override while code PRs gate on the real build AND on the
    # examples / governed-examples smoke lanes.
    #
    # ONE EXCEPTION to "skipped is allowed" — DRAFT PRs (FEL-437). Drafts skip
    # `check` / `examples` / `governed-examples` by design (see the `draft ==
    # false` guards, added to keep the inner Builder loop cheap), so without the
    # explicit test below this job would see three `skipped` results and report
    # SUCCESS having built and tested nothing. That is not hypothetical: on #622
    # and #624 the SAME commit carried two green `ci-ok` runs, one from the draft
    # pass where `check` was skipped and one from the real pass where it ran.
    #
    # It matters because `ci-ok` is the SOLE required context on `main`, and
    # "merge when ci-ok is green" is an operating rule people and agents act on.
    # A draft's green is indistinguishable from a real one in `gh pr checks` —
    # the distinguishing information lives in whether the `needs` were SKIPPED,
    # which nothing prompted anyone to read. GitHub does block merging a draft,
    # so this was never an untested-merge hole; the defect is that the status
    # LIES about coverage, and a stale draft-run green can still be the most
    # recent reported `ci-ok` for a SHA during the ready-for-review transition.
    #
    # Deliberately NOT fixed by removing "skipped is allowed": that exists so a
    # genuinely doc-only PR merges without an admin override, which is the very
    # mechanism FEL-429 exists to eliminate. Only the draft case is refused.
    #
    # `lesson-refs` carries no `if:` and no path filter, so it gates every PR
    # unconditionally, including doc-only ones. Deliberate: a doc-only PR is
    # precisely how an unreachable lesson citation gets in.
    #
    # (FEL-433: the doc-only skip described above is now REAL. It was inert until
    # FEL-433 — dorny defaults to `predicate-quantifier: some` and the leading
    # '**' matched every file, so `code` was true for every path and `check` ran
    # on doc-only PRs. The `code` filter now uses `every` and discriminates, so
    # `check` genuinely skips doc-only PRs and `lesson-refs` is what still gates
    # them.)
    #
    # examples + governed-examples were added after PR #549 merged
    # ci-ok-green while both were RED — `ci-ok` only watched `check`, so
    # branch protection (the sole required context on `main`) couldn't see
    # them. That regression broke every downstream consumer app build.
    #
    #
    # Each of check/examples/governed-examples is scheduled unconditionally
    # in the job graph (their own `if:` decides run vs. skip; none of them
    # can hang forever), so `needs` here can never deadlock — GitHub always
    # resolves every needed job to a terminal state (success/failure/
    # cancelled/skipped) before evaluating this job's `if: always()`, which
    # then runs regardless of what that state was.
    needs: [changes, check, scaffold-consistency, examples, governed-examples, lesson-refs, palette, readme-sync, gate-wiring, template-versions, alias-parity, platform-version-sync, native-changeset]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gate on required job results
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          SCAFFOLD_CONSISTENCY_RESULT: ${{ needs.scaffold-consistency.result }}
          EXAMPLES_RESULT: ${{ needs.examples.result }}
          GOVERNED_EXAMPLES_RESULT: ${{ needs.governed-examples.result }}
          LESSON_REFS_RESULT: ${{ needs.lesson-refs.result }}
          # `palette` was already in `needs:` — so this job WAITED on it — but
          # its result was never read here, so the gate reported green on a red
          # palette. The brand-contract check could not fail anything: exactly
          # the "a mandated verification that no gate performs is a gate that
          # cannot fail" defect the palette job's own comment was written to
          # end, reproduced one layer up. Being in `needs` is NOT being gated
          # on; only appearing in the loop below is.
          PALETTE_RESULT: ${{ needs.palette.result }}
          # readme-sync is always-on (no if:/filter), so it is never `skipped`
          # on a real event — it is success or failure. It MUST appear in the
          # loop below, not just here: being in `needs` is being WAITED on, not
          # gated on (the palette bug above, and #649, both proved that).
          README_SYNC_RESULT: ${{ needs.readme-sync.result }}
          # gate-wiring is always-on (no if:, no path filter) like readme-sync,
          # so it is never `skipped` on a real event. It MUST appear in the loop
          # below, not merely here: being in `needs` is being WAITED on, not
          # gated on. That distinction is now MACHINE-CHECKED — check:gate-wiring
          # parses this job and fails if any `needs:` entry is missing from the
          # loop or bound to the wrong job's result. Deleting the loop entry
          # while leaving this line is the palette/#649 defect, and it is the one
          # direction nobody in this repo had ever proven until now.
          GATE_WIRING_RESULT: ${{ needs.gate-wiring.result }}
          # template-versions is always-on (no if:, no path filter) like
          # readme-sync and gate-wiring, so it is never `skipped` on a real
          # event. Same rule as those two: being in `needs` is being WAITED on,
          # not gated on — it MUST also appear in the loop below, and
          # check:gate-wiring machine-checks that it does.
          TEMPLATE_VERSIONS_RESULT: ${{ needs.template-versions.result }}
          # alias-parity is always-on (no if:, no path filter) like readme-sync,
          # gate-wiring and template-versions, so it is never `skipped` on a real
          # event. Same rule as those three: being in `needs` is being WAITED on,
          # not gated on — it MUST also appear in the loop below, and
          # check:gate-wiring machine-checks that it does.
          ALIAS_PARITY_RESULT: ${{ needs.alias-parity.result }}
          PLATFORM_VERSION_SYNC_RESULT: ${{ needs.platform-version-sync.result }}
          NATIVE_CHANGESET_RESULT: ${{ needs.native-changeset.result }}
          # `true` only for a pull_request event whose PR is a draft. For push
          # and workflow_dispatch, `github.event.pull_request` is null and this
          # evaluates to `false` — so the draft rule below can never fire on a
          # branch build.
          IS_DRAFT: ${{ github.event.pull_request.draft == true }}
          # `changes.code` — 'false' means this PR is docs-only, so `check` skipped
          # BY DESIGN and ci-ok must still be green (the `on:`/`changes` header
          # promises exactly that). On a draft PR the `changes` job is skipped, so
          # this is '' — but the draft branch below never reads it. Empty on a
          # NON-draft (a broken `changes` job) must fail closed, not green.
          CODE_RESULT: ${{ needs.changes.outputs.code }}
        run: |
          echo "check:              $CHECK_RESULT"
          echo "scaffold-consist.:  $SCAFFOLD_CONSISTENCY_RESULT"
          echo "examples:           $EXAMPLES_RESULT"
          echo "governed-examples:  $GOVERNED_EXAMPLES_RESULT"
          echo "lesson-refs:        $LESSON_REFS_RESULT"
          echo "palette:            $PALETTE_RESULT"
          echo "readme-sync:        $README_SYNC_RESULT"
          echo "gate-wiring:        $GATE_WIRING_RESULT"
          echo "template-versions:  $TEMPLATE_VERSIONS_RESULT"
          echo "alias-parity:       $ALIAS_PARITY_RESULT"
          echo "platform-ver-sync:  $PLATFORM_VERSION_SYNC_RESULT"
          echo "native-changeset:   $NATIVE_CHANGESET_RESULT"
          echo "draft PR:           $IS_DRAFT"
          fail=0
          # FAIL-CLOSED, and the inversion is the whole point. This loop used to
          # read `if result = failure OR cancelled then fail=1` — an ALLOWLIST OF
          # BAD VALUES over an open-ended domain, which is fail-open by
          # construction. Misspell a var here or in the `env:` block above and
          # the pair expands to `<job>:` with an EMPTY result; empty is neither
          # "failure" nor "cancelled", so it matched nothing and PASSED. Drop the
          # whole `env:` block and ci-ok — the SOLE required status — went green
          # having read NOTHING, with zero error lines to notice. Measured on
          # main, not theorised: 7 vars unset -> fail=0, 0 output lines.
          #
          # `needs.<job>.result` yields exactly {success, failure, cancelled,
          # skipped}, so the two forms are behaviour-identical on every real
          # value (truth table run, all four). Only empty/unknown moves, and it
          # now moves to RED. A required status that errs toward red is one
          # commit from fixed; one that errs toward green is the defect this
          # repo has now shipped three times (palette, #649, this).
          checked=0
          for pair in "check:$CHECK_RESULT" "scaffold-consistency:$SCAFFOLD_CONSISTENCY_RESULT" "examples:$EXAMPLES_RESULT" "governed-examples:$GOVERNED_EXAMPLES_RESULT" "lesson-refs:$LESSON_REFS_RESULT" "palette:$PALETTE_RESULT" "readme-sync:$README_SYNC_RESULT" "gate-wiring:$GATE_WIRING_RESULT" "template-versions:$TEMPLATE_VERSIONS_RESULT" "alias-parity:$ALIAS_PARITY_RESULT" "platform-version-sync:$PLATFORM_VERSION_SYNC_RESULT" "native-changeset:$NATIVE_CHANGESET_RESULT"; do
            name="${pair%%:*}"
            result="${pair#*:}"
            checked=$((checked + 1))
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::Required job '$name' did not pass (result=$result)."
              fail=1
            fi
          done
          # POSITIVE CONTROL. The inversion above fixes bad VALUES and is blind to
          # a vacuous LIST: empty the `for pair in ...` contents and fail=0 with
          # zero iterations — the same green, the same silence. `fail=0` is an
          # ABSENCE REPORT ("no failing job found") and is indistinguishable from
          # "no job examined" unless the input is proven non-empty.
          #
          # `-ne`, not `-lt`, deliberately: adding an 11th job without updating
          # this count goes RED until someone reconciles needs: / the loop / this
          # number. That friction is the feature — it makes the triple explicit
          # instead of conventional.
          if [ "$checked" -ne 12 ]; then
            echo "::error::ci-ok examined $checked jobs, expected 12 — the result loop is truncated or a job was added without updating this count."
            fail=1
          fi
          # FEL-437 — a draft skipped the build, so "skipped is allowed" must not
          # silently read as a pass. Announced as a WARNING, not a failure.
          #
          # It used to fail, reasoning "a draft cannot be merged anyway, so this
          # blocks nothing." True in isolation, false in aggregate: agents are
          # instructed to push a draft PR as soon as they make their first edit
          # (work left only in a workspace is one reset from gone), so EVERY agent
          # PR was red from birth until someone promoted it. The queue filled with
          # red meaning "unfinished", real failures hid among them, and the board
          # trained everyone to ignore red — the same noise-over-signal defect
          # already fixed for the bench lanes. Red must mean "this is broken."
          #
          # Safe because two independent things stop an untested draft merging:
          # GitHub refuses to merge a draft PR at all, and draft -> ready is in
          # this workflow's `types:` list, so promotion fires a fresh run whose
          # `check` actually executes. The stale-green window the original comment
          # feared is closed by that trigger, not by this failure.
          if [ "$IS_DRAFT" = "true" ] && [ "$CHECK_RESULT" = "skipped" ]; then
            echo "::warning::Draft PR: 'check' was skipped, so nothing was built or tested. NOT evidence of a pass — mark ready for review to get a real result. Not failed, because a draft is unfinished, not broken. (FEL-437)"
          fi
          # A NON-draft whose `check` skipped is an anomaly ONLY when code changed.
          # A docs-only PR (changes.code == 'false') skips `check` BY DESIGN, and
          # the header above promises such a PR still gets ci-ok green so it is
          # mergeable without an admin override. This branch is the #670 x #667
          # INTERACTION, not a #670 overcorrection: #670 (01:12Z) made "non-draft +
          # check skipped" a hard failure, a CORRECT assumption when written because
          # the `changes.code` filter was still inert (leading ** under
          # predicate-quantifier: some killed every negation), so `code` was always
          # true and `check` always ran — this branch was unreachable. #667 (01:46Z)
          # made the filter actually discriminate, so a docs-only PR now correctly
          # skips `check`, which ARMED this latent branch. Proof it is the interaction:
          # #659 is docs-only, merged 01:46:01Z AFTER #670, and passed with
          # CHECK_RESULT=success because #667 had not landed yet. So exempt the
          # legitimate docs-only skip, and fail everything else that skipped without
          # being docs-only — including a broken `changes` (code=''), which fails closed.
          if [ "$IS_DRAFT" != "true" ] && [ "$CHECK_RESULT" = "skipped" ]; then
            if [ "$CODE_RESULT" = "false" ]; then
              echo "docs-only PR (changes.code=false): 'check' skipped by design — ci-ok green per policy."
            else
              echo "::error::'check' was skipped on a non-draft PR with code changes (changes.code='$CODE_RESULT') — ci-ok would be reporting on a build that never ran. Investigate the changes/paths filter before merging."
              fail=1
            fi
          fi
          if [ "$fail" = "1" ]; then
            exit 1
          fi
          echo "ci-ok: gate green"

  changes:
    # Determine which consumer subsystems changed in this push/PR.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.code_filter.outputs.code }}
      bench_lsp: ${{ steps.filter.outputs.bench_lsp }}
      governed: ${{ steps.filter.outputs.governed }}
    steps:
      - uses: actions/checkout@v7
      # `code` = any changed file that is NOT a doc/agent artifact. When false,
      # the PR is docs-only and the heavy `check` job is skipped (ci-ok still
      # reports green). This filter is NEGATION-BASED and so needs
      # `predicate-quantifier: every` (FEL-433): under dorny/paths-filter's
      # DEFAULT `some`, the leading `**` matches every file and every negation
      # below it is dead, so `code` was true even for docs-only PRs and the skip
      # never happened (verified with picomatch 4.0.5 under dorny's MatchOptions,
      # not inferred). `every` ANDs the rules, so a `docs/**` path fails
      # `!docs/**` and yields code=false. It is its OWN step because the
      # positive-include filters below (`bench`/`governed`) need `some` — a file
      # matches those if it hits ANY pattern — and a single quantifier per step
      # cannot serve both semantics.
      #
      # The `.md` exclusions are TARGETED at doc markdown, deliberately NOT a
      # blanket `!**/*.md`: `skills/aihu/**.md` are compiler INPUT that
      # check:skill-samples validates, so they must count as `code`. A blanket
      # `.md` exclusion under `every` would make a skills/aihu-only PR yield
      # code=false and SKIP the sample gate on exactly the PRs that can rot
      # samples — re-unwiring #615 through the front door (FEL-433 half-2).
      - uses: dorny/paths-filter@v4
        id: code_filter
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!.team/**'
              - '!docs/**'
              - '!.claude/**'
              - '!state-*.md'
              - '!README.md'
              - '!**/README.md'
              - '!**/CHANGELOG.md'
              - '!.changeset/**'
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            # Package performance gates moved with their sources to aihu-dom.
            # Keep the consumer workflow focused on compiler/application work.
            bench_lsp:
              - 'packages/language-server/src/**'
              - 'packages/language-server/tests/latency.bench.ts'
              - '.github/workflows/plan-a.yml'
            # Governed examples (Phase 2a): the build/smoke matrix for the 9
            # governed examples is paid ONLY when a subsystem they exercise, an
            # example, the cookbook, or the governed tooling changes. Docs-only /
            # unrelated-package PRs skip it entirely — keeping the always-on lane
            # cheap while still gating live-conditions coverage on qualifying PRs.
            governed:
              - 'packages/compiler/**'
              - 'packages/runtime/**'
              - 'packages/router/**'
              - 'packages/app/**'
              - 'packages/server/**'
              - 'packages/store/**'
              - 'packages/css-engine/**'
              - 'examples/**'
              - 'cookbook/**'
              - 'scripts/check-coverage-manifest.ts'
              - 'scripts/build-governed-examples.ts'
              - '.github/workflows/plan-a.yml'


  bench-lsp:
    # LSP hover-path latency gate. Fails if overall p95 exceeds 100ms.
    # Runs when language-server source or the bench file changes.
    needs: [check, changes]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: needs.changes.outputs.bench_lsp == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Run LSP hover-path latency gate
        working-directory: packages/language-server
        run: bun run bench:gate

  scaffold-consistency:
    # Fast ci-ok cell for the bug class fixed by
    # docs/plans/2026-08-08-ssr-vite-remediation.md: a scaffolded app that
    # builds green locally (against vite 6, what the template pins) and fails
    # for a real consumer on vite 8 — or a compiler change that only shows up
    # in a scaffolded app, never in this repo's own fixtures (the SSR
    # child-registry / ElementInternals bugs that plan fixed were BOTH
    # invisible to every existing in-repo test; only a real `npm create aihu`
    # -> build -> drive-the-Worker pass caught them).
    #
    # Deliberately NOT `scaffold-matrix.yml`'s full grid — that installs from
    # the LIVE REGISTRY across 4 package managers x 5 templates and takes tens
    # of minutes, and is not in `ci-ok` for exactly that reason. This job
    # tests THIS BRANCH'S OWN packages instead, via `--local-pkg` tarballs
    # (never `file:` — a linked package resolves `import('vite')` from the
    # MONOREPO's node_modules, not the scaffold's, which is the tree shape
    # that hid the vite-8 defect for months; see the flag's own docblock in
    # scaffold-matrix-e2e.ts), one package manager (bun), across BOTH vite
    # majors, on `minimal` and `ssr` only — a few minutes, not tens.
    #
    # `cf-team` is excluded for COST, not correctness. The reason recorded here
    # before — "it fails at `typecheck` on every FRESH scaffold, moon's `HEAD~1`
    # does not exist because the scaffold git-inits with exactly one commit" —
    # was wrong on both halves, and was never independently reproduced.
    #
    # Reproduced properly (scaffold, git-init one commit, install, run the
    # project's own `bun run typecheck`): moon does not consult `HEAD~1` for a
    # plain `moon run :typecheck` and is perfectly happy in a one-commit repo.
    # The failure was real, but its cause was a STALE `template.config.js`. That
    # file is the hand-maintained Node-importable twin of `template.config.ts`,
    # and `loadTemplateConfig` falls through to it whenever the runtime cannot
    # import TypeScript — i.e. always, under the published `#!/usr/bin/env node`
    # binary. Its `conditionalFiles` still named post-strip TARGET paths
    # (`apps/web/src/auth/kinde.ts`) rather than the `.tmpl` SOURCE paths on
    # disk, so not one conditional matched: every scaffold wrote all three auth
    # providers' files while installing only the chosen provider's SDK, and
    # typecheck died on TS2307 for the other two. Fixed, with a deep-equality
    # parity test over both manifests in packages/cli/tests/template-compat.test.ts.
    #
    # A fresh `cf-team` scaffold now typechecks clean on one commit. Adding it
    # to this job is a reasonable follow-up; it is left out here only because it
    # needs `moon` plus a third-party auth SDK from the network, which is a
    # different cost profile from the two `--local-pkg` cells above.
    needs: changes
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
      && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - name: Build @aihu/cli
        run: bun run --cwd packages/cli build
      - name: Scaffold consistency — minimal × vite 6, vite 8
        # `--mode local` drives `packages/cli/dist/create.js` — the scaffolder
        # THIS BRANCH builds (the step above) — instead of `bun create
        # aihu@latest` off the registry. That is what the `Build @aihu/cli` step
        # is for, and without the flag it was doing nothing: the harness's
        # default mode is `npm`, so this job was scaffolding with the PUBLISHED
        # create-aihu and only swapping the runtime packages for tarballs. A
        # template change (a new template, a widened `vite` range) was therefore
        # invisible to the one job that exists to catch scaffold regressions.
        run: |
          bun packages/cli/tests/scaffold-matrix-e2e.ts \
            --template minimal --pm bun --mode local --vite 6,8 \
            --local-pkg all \
            --cmd-timeout 300000 --server-timeout 120000 \
            2>&1 | tee scaffold-consistency.log
          # tee makes ${PIPESTATUS[0]} the harness's own exit code; `$?` would
          # be tee's and would turn every failure into a green run — same
          # reasoning as scaffold-matrix.yml's identical line.
          exit "${PIPESTATUS[0]}"
      - name: Scaffold consistency — ssr template (real built Worker, driven in-process)
        # A SEPARATE step, not folded into the one above, so a failure here is
        # attributable at a glance: "the client/SSG path broke" vs. "the
        # output:'ssr' Worker broke" are different bug classes with different
        # owners. No --vite axis here (deliberately): the vite axis exists to
        # catch a strip-time defect (un-stripped TypeScript), and that is
        # already covered by the step above; this step covers the OTHER two
        # bug classes the same plan fixed — the module-scope top-level-await
        # deadlock and the ElementInternals null-dereference — neither of
        # which is vite-version-dependent.
        #
        # `--mode local` is MANDATORY here, not a preference: `ssr` is a
        # template of THIS branch's `@aihu/cli`, so the published create-aihu
        # would exit with "not a template". See the step above for why the flag
        # belongs on both.
        run: |
          bun packages/cli/tests/scaffold-matrix-e2e.ts \
            --template ssr --pm bun --mode local \
            --local-pkg all \
            --cmd-timeout 300000 --server-timeout 120000 \
            2>&1 | tee -a scaffold-consistency.log
          exit "${PIPESTATUS[0]}"
      - name: Upload scaffold consistency log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scaffold-consistency-log
          path: scaffold-consistency.log
          retention-days: 14

  examples:
    # Consumer integration validates the published compiler package.
    # Build and smoke-test all polished examples (arch-2 M1 gate).
    # The governed path filter is the documented coverage boundary for this
    # suite. Keep the full example builds off unrelated package changes while
    # still running them whenever a covered subsystem, example, cookbook, or
    # the workflow itself changes.
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
      && needs.changes.outputs.governed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [check, changes]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
      - run: bun install --frozen-lockfile
      - name: Build workspace packages
        run: bun run build
      - name: Build examples
        run: |
          # Build only the polished examples that are also tested.
          # blog-loader (no index.html) and blog-router (.aihu without plugin) are WIP.
          # The agent-feature showcases (agent-hub, storefront) are NOT in this
          # `vite build` set: their app scaffolding uses dev-server-only wiring
          # (agent-hub's index.html references the /@shared/ URL form that rollup
          # cannot resolve at build; storefront aliases @aihu/arbor to a path it
          # doesn't declare/install), unrelated to .aihu compile-correctness. Their
          # SFC compile is guarded instead by check:emit-parses (#453), which
          # compiles every examples/**/*.aihu (both showcases included) at 0/0, and
          # their shape/API/wire contracts by the smoke suites in the test loop
          # below (#454).
          for dir in examples/live-counter examples/temperature-converter examples/timer examples/todo-mvc examples/color-theme; do
            echo "Building ${dir}..."
            (cd "${dir}" && bun run build) || exit 1
          done
      - name: Test examples
        run: |
          # agent-hub + storefront (#454): the agent-feature showcases. They went
          # green after #425 but were outside the built+tested set, so they could
          # regress silently again (which is how they broke originally). Their smoke
          # suites (source-text + agent-registry simulation; offline, no dev server)
          # run here so a shape/API/wire regression on either fails CI. Actual SFC
          # compile regressions are caught upstream by check:emit-parses (#453).
          for dir in examples/live-counter examples/temperature-converter examples/timer examples/todo-mvc examples/color-theme examples/agent-hub examples/storefront; do
            if [ -f "${dir}/tests/smoke.test.ts" ]; then
              echo "Testing ${dir}..."
              (cd "${dir}" && bun run test) || exit 1
            fi
          done

  governed-examples:
    # Consumer integration validates the published compiler package.
    # Phase 2a — the governed example set under live conditions.
    #
    # Path-gated (needs.changes.outputs.governed): only pays out when a subsystem
    # the governed set exercises, an example, the cookbook, or the governed
    # tooling changes. build:governed-examples reads each example's
    # coverage.manifest.json `ci` tier and, per example, either `vite build`s it
    # (todo-mvc, layouts, css-engine-utility, ssg-site — the SPA/@aihu-app set,
    # ssg-site additionally runs the SSG prerender pass) or runs its smoke suite
    # (the server/SSR examples, whose SFC compile is already gated by
    # check:emit-parses in `check`). The tier lives with the manifest, so this
    # lane can never drift from the governed set.
    #
    # Cost: ~4 vite builds (each ~0.1–0.4s of transform, ~20–40s incl. cold
    # workspace build amortised) + a handful of smoke suites → roughly +3–5 min
    # wall on a qualifying PR, dominated by the workspace build. Docs-only and
    # unrelated-package PRs skip it.
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
      && needs.changes.outputs.governed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [check, changes]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
      - run: bun install --frozen-lockfile
        env:
          # The compiler binary is restored from the exact-commit artifact below;
          # do not replace it with the published postinstall download.
          AIHU_SKIP_POSTINSTALL: "1"
      # Reuse the dist outputs built by `check` for this SHA. The lane keeps its
      # own install and manifest gate, but no longer pays for a second full
      # workspace build before exercising the governed consumers.
      - name: Download workspace build outputs
        uses: actions/download-artifact@v8
        with:
          name: workspace-build-${{ github.sha }}
          path: .
      # Manifest integrity (also runs in `check` — cheap, and keeps this lane
      # self-contained if `check` is ever re-scoped).
      - run: bun run check:coverage-manifest
      - name: Build + smoke the governed set (data-driven by manifest ci tiers)
        run: bun run build:governed-examples
        env:
          SCRIBE_SKIP_POSTINSTALL: "1"
