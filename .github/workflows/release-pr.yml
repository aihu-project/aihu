name: Changesets release PR

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  prepare-version:
    name: Compute release versions
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    # Merging the Version PR triggers both push workflows. release-tag.yml
    # recognizes this commit message and creates the release tag; don't start a
    # second native publish while that tag is being created.
    if: "!startsWith(github.event.head_commit.message, 'chore(release): version packages')"
    outputs:
      version_changed: ${{ steps.prepare.outputs.version_changed }}
      css_engine_platform_moved: ${{ steps.prepare.outputs.css_engine_platform_moved }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.8'
      - run: bun install --frozen-lockfile
      - name: Version, stamp css-engine binaries, and export the tree patch
        id: prepare
        shell: bash
        env:
          # @changesets/changelog-github looks up each changeset's commit and
          # PR author; the old changesets/action step supplied this token.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bun run release:version

          moved=false
          latest_tag=$(git describe --tags --match 'v*' --abbrev=0)
          if git diff --name-only "$latest_tag"...HEAD | grep -E '^packages/css-engine/crates/aihu-css-core/(src/.*\.rs|Cargo\.toml|build\.rs|recipes/.*\.css)$' > /dev/null; then
            published_versions=$(for package in \
              @aihu/css-engine-darwin-arm64 \
              @aihu/css-engine-darwin-x64 \
              @aihu/css-engine-linux-x64-gnu \
              @aihu/css-engine-win32-x64-msvc; do npm view "$package" version; done)
            published_version=$(printf '%s\n' "$published_versions" | sort -V | tail -n 1)
            native_source=$(git rev-parse HEAD:packages/css-engine/crates/aihu-css-core)
            published_native_source=$(npm view "@aihu/css-engine-linux-x64-gnu@$published_version" aihuNativeSource 2>/dev/null || true)
            reuse_output=$(bun scripts/css-engine-platform-reuse.ts "$native_source" "$published_native_source")
            printf '%s\n' "$reuse_output"
            if printf '%s\n' "$reuse_output" | grep 'CSS_ENGINE_PLATFORM_REUSE=true' > /dev/null; then
              stamp_output=$(bun scripts/stamp-platform-versions.ts --host css-engine --set-css-engine-version "$published_version")
            else
              stamp_output=$(bun scripts/stamp-platform-versions.ts --host css-engine --bump-css-engine --published-version "$published_version")
            fi
            printf '%s\n' "$stamp_output"
            if printf '%s\n' "$stamp_output" | grep 'CSS_ENGINE_PLATFORM_VERSION_MOVED=true' > /dev/null; then
              moved=true
            fi
          fi

          git add -N .
          git diff --binary HEAD > "$RUNNER_TEMP/version-pr.patch"
          if [ -s "$RUNNER_TEMP/version-pr.patch" ]; then
            echo 'version_changed=true' >> "$GITHUB_OUTPUT"
            echo 'css_engine_platform_moved='"$moved" >> "$GITHUB_OUTPUT"
          else
            echo 'version_changed=false' >> "$GITHUB_OUTPUT"
            echo 'css_engine_platform_moved=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Upload version PR patch for same-run publish
        if: steps.prepare.outputs.version_changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: version-pr-patch
          path: ${{ runner.temp }}/version-pr.patch
          if-no-files-found: error
          retention-days: 1

  publish-css-engine-platforms:
    name: Publish css-engine before its pins
    needs: prepare-version
    if: needs.prepare-version.outputs.version_changed == 'true' && needs.prepare-version.outputs.css_engine_platform_moved == 'true'
    uses: ./.github/workflows/release-platforms.yml
    permissions:
      contents: read
      id-token: write
    with:
      is_release: true
      canary: false
      dry_run: false
      scope: css-engine
      stamped_version_artifact: true
    secrets: inherit

  update-release-pr:
    name: Resolve pins and update Version PR
    needs: [prepare-version, publish-css-engine-platforms]
    # GitHub marks a skipped reusable workflow job as successful for `needs`;
    # the publish job is skipped on ordinary Version PRs with no native change.
    if: always() && needs.prepare-version.result == 'success' && needs.prepare-version.outputs.version_changed == 'true' && (needs.publish-css-engine-platforms.result == 'success' || needs.publish-css-engine-platforms.result == 'skipped')
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - name: Mint GitHub App installation token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.8'
      - name: Apply prepared Version PR changes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: version-pr-patch
          path: .
      - name: Publish-before-pins assertions
        run: |
          set -euo pipefail
          git apply version-pr.patch
          # npm can take 10-20 minutes to serve a just-published version. Bun
          # silently drops an optionalDependency it can't resolve, so installing
          # before the registry lists the stamped platform packages writes a
          # lockfile without them. Wait (up to 30 minutes) for every css-engine
          # platform pin in the host manifest to resolve first.
          for attempt in $(seq 1 60); do
            missing=0
            for pin in $(node -e 'const m=require("./packages/css-engine/package.json");for(const [n,v] of Object.entries(m.optionalDependencies||{}))console.log(n+"@"+v)'); do
              if [ "$(npm view "$pin" version 2>/dev/null)" = "" ]; then missing=1; echo "waiting for $pin"; fi
            done
            [ "$missing" = 0 ] && break
            if [ "$attempt" = 60 ]; then echo "platform pins never appeared on npm"; exit 1; fi
            sleep 30
          done
          bun install
          bun scripts/check-lockfile-platform-pins.ts
          for attempt in $(seq 1 12); do
            if bun scripts/check-pins-published.ts --strict; then
              exit 0
            fi
            if [ "$attempt" -lt 12 ]; then sleep 10; fi
          done
          exit 1
      - name: Commit and update the Version PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HUSKY: '0'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B changeset-release/main
          git add -A
          git diff --cached --quiet || git commit -m 'chore(release): version packages'
          bun scripts/release-pr-body.ts origin/main > "$RUNNER_TEMP/version-pr-body.md"
          git push --force-with-lease origin HEAD:changeset-release/main
          # OPEN PRs only: `gh pr view <branch>` also finds the merged Version
          # PR of the previous release, and editing that one would leave no
          # open Version PR at all.
          open_pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head changeset-release/main --state open --json number --jq '.[0].number // empty')
          if [ -n "$open_pr" ]; then
            gh pr edit "$open_pr" --repo "$GITHUB_REPOSITORY" \
              --title 'chore(release): version packages' \
              --body-file "$RUNNER_TEMP/version-pr-body.md"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head changeset-release/main \
              --title 'chore(release): version packages' \
              --body-file "$RUNNER_TEMP/version-pr-body.md"
          fi
