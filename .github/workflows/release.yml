name: Release Aihu packages

# Publish the Aihu packages and native server/CSS assets, then create a GitHub
# Release with the native assets attached. The standalone aihu-compiler
# repository owns compiler binaries and its release workflow.
#
# Triggers:
#   - push of any tag matching `v*` (real release)
#   - manual workflow_dispatch with optional `tag` input (dry run; binaries
#     are uploaded as workflow artifacts but no GitHub Release is created
#     unless the input parses as an actual `v*` tag).
#   - manual workflow_dispatch with `canary: true` — CANARY SNAPSHOT release:
#     every publish job first runs `changeset version --snapshot canary`
##     producing `0.0.0-canary-<shortsha>` versions, then publishes to the
#     `canary` npm dist-tag so `latest` (and every plain `npm install`) is
#     UNAFFECTED. Consumers pin with `npm install @aihu/app@canary` or the
#     exact snapshot version. `dry_run` defaults to TRUE: the default canary
#     run versions + builds + packs with `npm publish --dry-run` (no network
#     write); a human must explicitly pass dry_run=false to publish for real.
#     The snapshot suffix is the COMMIT hash (.changeset/config.json
#     `snapshot.prereleaseTemplate: "{tag}-{commit}"`), so the independent
#     publish jobs below all compute the IDENTICAL version from the same
#     checked-out SHA — no cross-job version handoff needed. Snapshot bumps
#     are ephemeral (never committed); no GitHub Release and no git tag is
#     created for canaries.
#
# Compiler binaries and WASM artifacts are released by the standalone
# aihu-compiler repository. This workflow owns only the root server/CSS native
# lanes and packages that consume the published compiler.
"on":
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional tag to dry-run the build against (no release created)'
        required: false
        default: ''
      canary:
        description: 'Canary snapshot release: version 0.0.0-canary-<sha> and publish to the `canary` npm dist-tag'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Canary only: pack + validate with npm publish --dry-run (no network write). Set to false to publish for real.'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

# Force every `cargo` invocation to resolve toolchain to 1.95 by default.
# The dtolnay/rust-toolchain action installs the version but doesn't always
# rewrite rustup's default; without this env, plain `cargo build` falls back
# to the system default which fails MSRV checks. See PR #68 for the original
# toolchain bump and run 25394476208 for the failure that exposed the
# env-vs-default-toolchain gap. 1.88 → 1.95 (W2 advanced-js-template-
# expressions): oxc_parser 0.139 requires rustc >= 1.94; keep in sync with
# rust-toolchain.toml and deploy-docs.yml.
env:
  RUSTUP_TOOLCHAIN: "1.95.0"

jobs:
  # Lockfile integrity, checked ONCE and checked EARLY.
  #
  # FEL-RELEASE-FROZEN-LOCK. Check the committed lockfile before any native
  # platform publish can change registry resolution. A frozen install here
  # catches manifest/lock drift while publish-packages uses a plain install
  # after the platform jobs have completed.
  #
  # The root server/CSS platform packages are synchronized by the release
  # workflow before their canary/stable publish. The compiler package and its
  # binaries are owned by the standalone aihu-compiler repository.
  lockfile-integrity:
    name: Lockfile integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: bun install --frozen-lockfile
        # --ignore-scripts: this job only answers "does bun.lock agree with the
        # manifests at this SHA". Postinstall scripts are build work, and doing
        # them here would just be a slower way to get the same boolean.
        run: bun install --frozen-lockfile --ignore-scripts

  # Native-addon build/publish families (@aihu/server and @aihu/css-engine)
  # and their
  # platform-package publishes all live in release-platforms.yml now — see
  # the `platforms` job below and that file's own header comment for why
  # `workflow_call` (same run, artifacts stay visible) rather than a second
  # top-level workflow.
  platforms:
    name: Build and publish platform packages
    uses: ./.github/workflows/release-platforms.yml
    permissions:
      contents: read
      id-token: write
    with:
      is_release: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.canary) }}
      canary: ${{ github.event_name == 'workflow_dispatch' && inputs.canary || false }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
    secrets: inherit

  release:
    name: Publish GitHub Release
    # Wait for all native server/CSS jobs before flattening their release assets.
    # `platforms` is a workflow_call job, so this covers every job inside
    # release-platforms.yml.
    needs: [platforms]
    runs-on: ubuntu-22.04
    # Longest observed run of this job is ~3 min; without a bound a hang
    # inherits GitHub's 360 min default and stalls the release for six hours.
    timeout-minutes: 20
    # Only create a Release when triggered by an actual tag push.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten artifact directory
        run: |
          set -euo pipefail
          mkdir -p release-assets
          # Skip 0-byte files. The GitHub Release Asset API rejects empty
          # uploads with "size must be greater than or equal to 1"; a single
          # empty sidecar (typically from a partial-failed prior run that
          # downloaded an artifact for re-upload) would tank the whole
          # release-create step.
          #
          # download-artifact@v4 (no `name:` filter, above) lays every run's
          # artifacts out as artifacts/<artifact-name>/<original-basename> —
          # the <artifact-name> segment is unique per upload-artifact step
          # (native-<platform>, css-native-<platform>), but not every
          # basename is: every css-native-<platform> artifact (except win32,
          # which is the differently-named aihu-css-compile.exe) contains a
          # file literally named aihu-css-compile. A bare
          # `cp {} release-assets/` collapses all three onto one path — last
          # write wins, no error — which is exactly how the css binary in a
          # past Release ended up advertising a nondeterministic platform.
          #
          # Fix: copy under the plain basename when nothing has claimed it yet.
          # On an actual collision, fall back to
          # an artifact-directory-qualified name, so a second file with the
          # same basename still ships instead of silently vanishing.
          while IFS= read -r f; do
            dir="$(dirname "$f")"
            artifact_name="$(basename "$dir")"
            base="$(basename "$f")"
            dest="release-assets/$base"
            if [ -e "$dest" ]; then
              dest="release-assets/${artifact_name}-${base}"
              if [ -e "$dest" ]; then
                echo "::error::asset name collision even after qualifying with the artifact directory: $dest (from $f)"
                exit 1
              fi
              echo "note: $f basename '$base' collides with an already-staged asset — staging as $(basename "$dest") instead"
            fi
            cp "$f" "$dest"
          done < <(find artifacts -type f ! -empty | sort)
          ls -la release-assets/
          # An empty artifact file means a producer step failed silently — it
          # wrote a redirect target but never filled it. Skipping those (which
          # the `! -empty` filter above does) is what let the darwin .sha256
          # sidecars vanish from every release without one job going red. The
          # filter stays, because a zero-byte asset is genuinely not shippable;
          # what changes is that it is now an ERROR rather than a silent drop.
          empty_files="$(find artifacts -type f -empty | sort)"
          if [ -n "$empty_files" ]; then
            echo "::error::empty artifact file(s) — the step that produced each one failed without failing the job:"
            echo "$empty_files" | sed 's/^/  /'
            exit 1
          fi
          # Sanity count: one asset per upload-artifact step is expected at
           # minimum (some native jobs upload 2 — binary +
          # .sha256). A run with fewer files than artifact directories means
          # something silently produced nothing, not that everything is fine.
          artifact_dirs=$(find artifacts -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')
          staged=$(find release-assets -type f | wc -l | tr -d ' ')
          echo "staged $staged release asset(s) from $artifact_dirs artifact director(y/ies)"
          if [ "$staged" -lt "$artifact_dirs" ]; then
            echo "::error::staged fewer release assets ($staged) than artifact directories ($artifact_dirs) — at least one artifact directory contributed nothing"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v2.2.1
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  # ---------------------------------------------------------------------------
  # Publish all tier A/B/C/D @aihu/* JS packages on `v*` tag.
  #
  # Mirrors the publish-native pattern: triggered only by an actual tag push,
  # authenticates to npm with the repository's trusted-publisher OIDC policy,
  # then runs after the server/CSS native builds and stable-tag publications so
  # declared `optionalDependencies` resolve. Canary runs publish root JS
  # packages with their last stable native pins and do not publish natives.
  #
  # Uses `bun publish --workspaces` because Bun rewrites `workspace:*` deps to
  # actual versions automatically. Changesets has versioned the packages on
  # the previous Release-PR merge; this job just publishes whatever's in
  # package.json today.
  # ---------------------------------------------------------------------------
  publish-packages:
    name: Publish @aihu/* packages to npm
    # lockfile-integrity is FIRST and is not decorative: it holds the
    # --frozen-lockfile check this job used to perform itself. Keeping it in
    # `needs:` means a genuine lock/manifest mismatch still blocks the publish
    # instead of merely reporting red beside it. See that job's comment.
    # `platforms` waits for both root native lanes before package publishing.
    # The standalone aihu-compiler repository releases @aihu/compiler and its
    # platform binaries independently.
    needs: [lockfile-integrity, platforms]
    runs-on: ubuntu-22.04
    # Longest observed run of this job is ~3 min; without a bound a hang
    # inherits GitHub's 360 min default and stalls the release for six hours.
    timeout-minutes: 30
    # Tag push (stable) OR canary workflow_dispatch. In canary mode the needed
    # publish-* jobs above all run (canary condition), so `needs` still chains.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.canary)
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node (for npm trusted publishing)
        uses: actions/setup-node@v7
        with:
          # npm trusted publishing requires Node >=22.14 and npm >=11.5.1.
          # Node 24 is the supported release line used in npm's reference flow.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Setup moon toolchain
        # `bun run build` invokes `moon run :build` (root package.json) which
        # requires the moon CLI on PATH. Plan A CI installs this via
        # moonrepo/setup-toolchain; mirror it here so prepublishOnly can
        # actually compile the workspace before publish.
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Install workspace
        # NOT --frozen-lockfile, deliberately. This job `needs:` the root
        # server/CSS platform-publish jobs, so by the time it runs those versions
        # exist on npm — versions that were UNRESOLVABLE when bun.lock was last
        # refreshed and are therefore absent from it. A frozen install resolves
        # them, wants to add them, and hard-fails. That is not hypothetical: it
        # is what half-published v0.4.62 (binaries yes, JS packages no).
        #
        # Integrity has not been dropped, it has been MOVED. The
        # `lockfile-integrity` job runs the frozen install with no `needs:`, so
        # it observes the registry before this workflow can change it, and this
        # job gates on it. Restoring --frozen-lockfile here re-breaks the
        # release on the next tag that publishes a new platform version.
        #
        # Letting the platform packages actually install is a bonus: this is the
        # first point in the pipeline where a broken platform publish surfaces
        # rather than being silently dropped as an unresolvable optional dep.
        run: bun install

      - name: Snapshot version (canary)
        # Ephemeral 0.0.0-canary-<sha> versions for root JavaScript packages.
        # Server/CSS native families keep their independently released stable
        # pins; native canary publication is disabled in release-platforms.yml.
        if: github.event_name == 'workflow_dispatch' && inputs.canary
        env:
          HUSKY: '0'
          # @changesets/changelog-github requires a token even for snapshot
          # changelog assembly.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun scripts/canary-catchall-changeset.ts
          bun changeset version --snapshot canary
          bun install

      - name: Build all packages
        run: bun run build

      - name: Publish via Changesets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # OIDC trusted-publisher allowlist (Settings → Secrets and variables
          # → Actions → Variables). Comma-separated short names:
          # "signals,arbor,runtime,context,data". publish-all.sh adds
          # --provenance only for listed packages so unconfigured tiers don't
          # fail mid-rollout. Set NPM_PROVENANCE=1 once every package has the
          # npmjs.com trusted-publisher config done.
          NPM_PROVENANCE_PKGS: ${{ vars.NPM_PROVENANCE_PKGS }}
          NPM_PROVENANCE: ${{ vars.NPM_PROVENANCE }}
          CANARY: ${{ (github.event_name == 'workflow_dispatch' && inputs.canary) && '1' || '' }}
          CANARY_DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.canary && inputs.dry_run) && '1' || '' }}
        # Stable (tag push): `bun run release` = build + publish-all.sh → latest.
        # Canary: same build, then publish-all.sh --tag canary (+ --dry-run by
        # default) — publish-all.sh itself refuses 0.0.0-* snapshots on `latest`.
        run: |
          if [ -n "${CANARY:-}" ]; then
            bun run build
            ARGS="--tag canary"
            if [ -n "${CANARY_DRY_RUN:-}" ]; then ARGS="--dry-run $ARGS"; fi
            bash scripts/publish-all.sh $ARGS
          else
            bun run release
          fi
