name: Deploy aihu-docs

# Deploys apps/docs to Cloudflare Pages (project: aihu-docs) — the live site.
#
# Production deploy: push to main → branch "main" → aihu.dev
# Preview deploy:    pull_request  → branch name   → <branch>.aihu-docs.pages.dev
#
# This workflow began life as deploy-docs-next.yml, deploying the rebuilt docs
# to a separate zero-risk Pages project while the old apps/docs still served
# aihu.dev. At the cutover the rebuilt app became apps/docs, this file replaced
# the old deploy-docs.yml, and the project name moved back to aihu-docs — so
# the domain and the Pages project never moved, only the source directory.
#
# Required repository secrets (reused from deploy-docs.yml — same Cloudflare
# account, different Pages project):
#   CLOUDFLARE_API_TOKEN   — CF API token with Pages:Edit permission
#   CLOUDFLARE_ACCOUNT_ID  — Cloudflare account ID

"on":
  push:
    branches:
      - main
    # NOTE: this list is duplicated verbatim under `pull_request` below.
    # GitHub Actions does not support YAML anchors in workflow files, so the
    # two must be edited together — keep them identical.
    paths:
      - 'apps/docs/**'
      - '.github/workflows/deploy-docs.yml'
      # The framework packages this app BUILDS THROUGH. Watching only
      # `apps/docs/**` was backwards: the docs app dogfoods @aihu/app + vite
      # SSG and resolves every @aihu/* import through package.json `exports` →
      # dist/*, so a change to the prerenderer or the SSR renderer changes what
      # the docs app emits without touching a single file under apps/docs.
      # deploy-docs.yml watched five framework packages for apps/docs, which
      # has its OWN bespoke build.ts and barely touches that path — so the more
      # framework-sensitive app was the one watching nothing.
      #
      # This is not hypothetical: #748 (prerender layout recovery) and #749
      # (SSR route context) both changed the SSG path the docs app builds through,
      # and neither triggered this workflow. Since the doc-coverage, Playwright
      # and Lighthouse gates all live in THIS file, all three sat dark for both.
      - 'packages/app/**'
      - 'packages/server/**'
      - 'packages/router/**'
      - 'packages/runtime/**'
      - 'packages/store/**'
      - 'packages/context/**'
      - 'packages/compiler/**'
      - 'packages/css-engine/**'
      - 'packages/plugin-agent-readiness/**'
      # Version-bearing manifests: a `chore(release): version packages` merge
      # rewrites these without touching source (same reasoning as
      # deploy-docs.yml's entry, which was added after 7 of 49 release merges
      # shipped a stale docs build).
      - 'packages/*/package.json'
  pull_request:
    # Keep identical to the `push` list above (no anchors in Actions YAML).
    paths:
      - 'apps/docs/**'
      - '.github/workflows/deploy-docs.yml'
      - 'packages/app/**'
      - 'packages/server/**'
      - 'packages/router/**'
      - 'packages/runtime/**'
      - 'packages/store/**'
      - 'packages/context/**'
      - 'packages/compiler/**'
      - 'packages/css-engine/**'
      - 'packages/plugin-agent-readiness/**'
      - 'packages/*/package.json'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  deploy:
    # NOT "Build & deploy". deploy-docs.yml's deploy job already emits a check
    # by that exact name, and a required status check is matched by NAME — so
    # requiring "Build & deploy" (which the cutover plan calls for) could be
    # satisfied by the OLD docs deploying on a PR where this workflow never
    # ran. Green, and meaningless. The name is the thing that has to be
    # unambiguous, so it says which app it built.
    name: Build & deploy
    # Dependabot PRs run with GITHUB_TOKEN only — repo Actions secrets (incl.
    # CLOUDFLARE_API_TOKEN) are deliberately withheld by GitHub for security,
    # a separate store from regular repo secrets (Settings > Secrets >
    # Dependabot). Deploying THAT would mean any dependency-bump PR carries
    # real Cloudflare deploy credentials — not a tradeoff to make for an
    # actions-version bump that touches no app code. This is the docs app's ONLY
    # job (build+deploy combined, unlike deploy-docs.yml's separate `test`),
    # so skipping it loses the build-verification signal too for Dependabot
    # PRs specifically; acceptable for the same reason.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so `moon run :build` can resolve `main` + the merge-base
          # to compute affected packages. A shallow checkout makes moon's git
          # diff fail with "fatal: ambiguous argument 'main'" (exit 128).
          fetch-depth: 0

      # The docs app dogfoods @aihu/app + vite SSG, which resolves every @aihu/*
      # workspace import through package.json `exports` → dist/*. Unlike
      # apps/docs (its own bespoke build.ts), there is no bundler-level
      # source-alias fallback here — the workspace packages' dist/ must exist
      # on disk before `vite build` runs, so this job builds the whole
      # packages/* graph first (mirrors the `examples` / `governed-examples`
      # jobs in plan-a.yml, the closest existing precedent for an apps/*
      # build that depends on built workspace packages).
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      # aihu-compile (the .aihu SFC compiler) is a native Rust binary, needed
      # here for the vite-plugin compiler pass.
      #
      # The docs app also carries the in-browser WASM playground (/playground,
      # ported from apps/docs), whose `prebuild` builds the compiler to
      # wasm32-unknown-unknown from THIS checkout via scripts/build-wasm-bundle.ts
      # — so this job needs the same wasm32 target + wasm-pack that
      # deploy-docs.yml installs. Building from the checkout rather than fetching
      # a release is deliberate: a released bundle lags the workspace grammar and
      # every preset then fails to compile with C306 (#491).
      #
      # This is not optional-with-a-soft-landing in CI: apps/docs/scripts/
      # stage-wasm.ts passes --strict whenever $CI is set, so a missing toolchain
      # fails the deploy here instead of silently shipping a playground that
      # cannot compile anything.
      - name: Install Rust toolchain (+ wasm32 for the playground bundle)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.95.0" # sync with rust-toolchain.toml
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Cache Rust build (deps only; aihu-compile always rebuilds)
        uses: Swatinem/rust-cache@v2

      - name: Build compiler binary
        run: cargo build --release --manifest-path packages/compiler/Cargo.toml
        env:
          CARGO_TERM_COLOR: always

      # aihu-css-compile (the css-engine's native CSS compiler) is the SECOND
      # native binary this job needs, and unlike aihu-compile above it was never
      # built here — the docs app's `prebuild` → `gen:css` → `compile()` calls it
      # directly (apps/docs/gen-css.ts), and the vite plugin's compileSfc()
      # pass calls it again. deploy-docs.yml gets away without this step because
      # apps/docs has no gen:css and never touches @aihu/css-engine at build time.
      #
      # Until now this job resolved the binary from the PUBLISHED
      # @aihu/css-engine-<platform> optionalDependency instead. That is a silent
      # single point of failure: optionalDependencies are dropped WITHOUT error
      # when unresolvable, so the moment packages/css-engine/package.json pinned
      # a version that had not been published yet (0.1.4 in #725, then 0.1.17),
      # installs kept "succeeding" and the job died much later with
      # "Native CSS compiler binary not found for this platform" — red since
      # 2026-08-01, green through 2026-07-30 on the last published pin (0.1.3).
      #
      # Building from source removes the coupling to release cadence entirely:
      # resolveBinary() checks target/release/aihu-css-compile as a dev fallback
      # (it is named in that very error message's "Checked dev fallback paths"),
      # so a source build satisfies both call sites and an unpublished pin can
      # never break docs deploys again. Same shape as the compiler step above.
      - name: Build css-engine binary
        run: cargo build --release -p aihu-css-core
        env:
          CARGO_TERM_COLOR: always

      - name: Stage compiler binary
        run: |
          mkdir -p packages/compiler/bin
          # packages/compiler is a root-workspace member, so the binary lands in
          # the workspace-root target/, not packages/compiler/target/.
          cp target/release/aihu-compile packages/compiler/bin/aihu-compile
          chmod 0755 packages/compiler/bin/aihu-compile

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          AIHU_SKIP_POSTINSTALL: "1"

      # Builds every packages/* project (moon run :build) in dependency order:
      # compiler → css-engine/arbor/runtime/signals/... → server/router → app.
      # The docs app's own build only compiles ITS OWN .aihu/.ts sources; it never
      # rebuilds its @aihu/* workspace deps.
      - name: Build workspace packages
        run: bun run build
        env:
          # See the note on the docs build step below — same reason.
          AIHU_COMPILE_BIN: ${{ github.workspace }}/packages/compiler/bin/aihu-compile

      # Doc-coverage gate. The retired apps/docs shipped an existence-only
      # check (does a page file exist); this is a DRIFT check — gen-api.ts re-derives every documentable package's
      # export surface from source via the TypeScript AST and fails if the
      # committed src/pages/api/*.aihu + src/data/api/generated/*.ts disagree
      # with it. MUST run after "Build workspace packages", not right after
      # checkout: for a package whose `exports` target has no `src/` sibling,
      # gen-api.ts's entryFiles falls back to the built `dist/*.d.ts`/`dist/*.js`
      # (apps/docs/scripts/gen-api.ts's extractPackage), and a fresh
      # checkout has no dist/ at all (.gitignore'd) — running this any earlier
      # manufactures false drift on those packages every time.
      - name: Doc-coverage gate (gen:api --check)
        run: bun scripts/gen-api.ts --check
        working-directory: apps/docs

      - name: Build docs
        # prebuild (gen:css + gen:preview + gen:wasm) then vite build → dist.
        # public/ is copied into dist/ by vite as static assets — that covers
        # both the agent-discovery surface (ai.txt, agents.json, openapi.json,
        # .well-known/*) and the two playground artifacts the prebuild stages
        # there (wasm/ and aihu-preview-bundle.js), which is why the playground
        # needs no custom vite plugin.
        run: bun run build
        working-directory: apps/docs
        env:
          # WITHOUT this, the two steps above ("Build compiler binary" / "Stage
          # compiler binary") are dead weight. packages/compiler/js/envelope.ts
          # gates on `AIHU_COMPILER_NATIVE === '0' || AIHU_COMPILE_BIN` — an
          # `||` — so with neither set it loads the PUBLISHED napi addon
          # in-process and never spawns the binary this job just built. A
          # compiler fix would then be invisible to its own CI. This is what hid
          # the TDZ bug in apps/docs; deploy-docs.yml carries the same two hunks.
          AIHU_COMPILE_BIN: ${{ github.workspace }}/packages/compiler/bin/aihu-compile

      # Redirect map — verified against the BUILT dist, before anything slower
      # runs (it needs only the emitted pages, and it is the cheapest gate here).
      #
      # `_redirects` is a static file copied verbatim into dist, so nothing else
      # in this job looks at it: not the build, not Playwright, not Lighthouse.
      # A rule pointing at a page that does not exist is therefore completely
      # silent — Cloudflare serves the 301 and the visitor lands on a 404. These
      # particular rules carry ~27 URLs that are live on aihu.dev today across
      # the docs IA move, and they are in the published sitemap, so a
      # broken one converts an indexed URL into a 404 rather than preserving it.
      - name: Redirect map gate
        run: bun scripts/check-redirects.ts
        working-directory: apps/docs

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
        working-directory: apps/docs

      # Smoke tests against the real built dist/ (vite preview, not the SSG dev
      # server) — homepage, guide + API-datasheet navigation, and the WASM
      # playground island (boots with no error banner, zero console errors,
      # ?preset= deep link). See apps/docs/playwright.config.ts.
      - name: Run smoke tests
        run: bunx playwright test --reporter=line
        working-directory: apps/docs

      # Lighthouse quality gate — same script + thresholds as deploy-docs.yml,
      # pointed at the docs app's dist and its canonical content page
      # (/guides/getting-started, the closest analog to /docs/introduction).
      # Runs in this single build+deploy job (this app has no separate
      # always-on `test` job like deploy-docs.yml) so a perf/a11y regression
      # blocks the deploy step below outright.
      - name: Lighthouse gate
        run: bun scripts/lighthouse.ts

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-results
          path: scripts/lighthouse-results.json
          if-no-files-found: ignore

      - name: Ensure Pages project exists
        # Idempotent: creates aihu-docs on first run; continue-on-error lets
        # re-runs pass when it already exists. Pages:Edit on the token covers
        # creation. Separate project from live aihu-docs — never touches aihu.dev.
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create aihu-docs --production-branch main

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/docs/dist --project-name aihu-docs --branch ${{ github.head_ref || github.ref_name }}

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const url = '${{ steps.deploy.outputs.deployment-url }}'
            if (!url) return
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `📄 docs preview: ${url}`,
            })
