name: Visual regression — Chromatic
# Plan 6 (master spec §10.1): uploads the built Storybook to Chromatic on
# every PR + post-merge to main. PR check fails on unapproved visual diffs;
# baselines auto-accept on merge to main.
#
# Requires the CHROMATIC_PROJECT_TOKEN repository secret (Chromatic OSS plan).
# Until the secret is configured this workflow reports red — expected.
#
# Pack × mode matrix (aihu-default/aihu-graphite × light/dark) comes from the
# globals-based Chromatic modes declared in apps/storybook/.storybook/preview.ts;
# viewports (1280/375) are set per full-matrix story.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/primitives/**'
      - 'packages/ui/**'
      - 'packages/css-engine/**'
      - 'apps/storybook/**'
      - '.github/workflows/visual.yml'
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# Least-privilege floor (CodeQL: Workflow does not contain permissions). No
# job here pushes commits, comments, or writes releases/packages — read-only
# GITHUB_TOKEN covers checkout + the actions used.
permissions:
  contents: read
jobs:
  changes:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      storybook: ${{ steps.filter.outputs.storybook }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            storybook:
              - 'packages/primitives/**'
              - 'packages/ui/**'
              - 'packages/css-engine/**'
              - 'apps/storybook/**'
              - '.github/workflows/visual.yml'

  chromatic:
    needs: changes
    # Dependabot PRs run with GITHUB_TOKEN only — repo Actions secrets (incl.
    # the Chromatic project token) are deliberately withheld by GitHub for
    # security, a separate store from regular repo secrets (Settings >
    # Secrets > Dependabot). An actions-version bump touches no Storybook
    # content anyway, so a visual-regression snapshot has no signal to give.
    if: >-
      github.actor != 'dependabot[bot]'
      && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
      && (github.event_name != 'pull_request' || needs.changes.outputs.storybook == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Chromatic requires full git history for baseline resolution.
          fetch-depth: 0
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
      # Chromatic is a framework consumer. Its .aihu transforms use the
      # locked, published @aihu/compiler package.
      - run: bun install --frozen-lockfile
      - name: Build workspace packages
        run: bun run build
      - name: Build Storybook
        run: bun run --cwd apps/storybook build-storybook
      - name: Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          storybookBuildDir: apps/storybook/storybook-static
          # Post-merge to main auto-accepts the new baselines (spec §10.1 CI flow).
          autoAcceptChanges: main
          exitOnceUploaded: false
